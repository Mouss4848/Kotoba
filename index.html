<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F6F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="言葉">
<link rel="apple-touch-icon" href="icon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
<link rel="icon" type="image/png" href="icon.png?v=3">

<title>言葉 — Kanji &amp; grammaire</title>
<style>
:root{--paper:#F6F1E7;--paper2:#FFFCF5;--ink:#1F1B17;--ink2:#6B645B;--ink3:#A39B8E;--line:#E6DECF;--line2:#D3C9B6;--seal:#C8322B;--seal2:#E8635C;--gold:#B8892E;--ok:#2E7D5B;--ko:#B23A3A;--sel:#E9E1D2;--r:18px;--sh:0 1px 0 rgba(0,0,0,.02),0 8px 24px -18px rgba(60,40,20,.35)}
html[data-theme="nuit"]{--paper:#171410;--paper2:#1F1B16;--ink:#EDE6D8;--ink2:#A69D8E;--ink3:#6E665B;--line:#2C2620;--line2:#3A332B;--seal:#D9453C;--seal2:#F0736B;--gold:#D2A44A;--ok:#5FBF93;--ko:#E06A6A;--sel:#2A241D;--sh:0 10px 30px -18px rgba(0,0,0,.8)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.jp{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","Noto Serif JP","MS Mincho",serif}
.jps{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
input{font:inherit;color:inherit}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.hd{display:flex;align-items:center;gap:8px;padding:12px 18px 6px;min-height:58px}
.hd h1{font-size:19px;font-weight:600;flex:1;letter-spacing:-.01em;line-height:1.15;min-width:0}
.hd h1 small{display:block;font-size:12.5px;color:var(--ink2);font-weight:400;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--ink2);transition:background .15s}
.ib:active{background:var(--sel)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 28px}
.enso{position:relative;width:132px;height:132px;margin:8px auto 4px}.enso svg{width:100%;height:100%;transform:rotate(-90deg)}
.enso .c{fill:none;stroke:var(--line2);stroke-width:5}.enso .p{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)}
.enso.full .p{stroke:var(--seal)}.enso .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.enso .t b{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}.enso .t small{font-size:11px;color:var(--ink2);margin-top:3px}
.hero{text-align:center;padding:6px 0 10px}.hero .date{font-size:12.5px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.hero .pd{font-size:22px;margin-top:10px;line-height:1.5}.hero .pdf{font-size:13px;color:var(--ink2);margin-top:2px}
.pri{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--r);background:var(--ink);color:var(--paper);box-shadow:var(--sh);transition:transform .12s;margin-bottom:10px}
.pri:active{transform:scale(.985)}.pri .n{font-size:30px;font-weight:600;line-height:1;min-width:44px}.pri .t{flex:1;min-width:0}
.pri .t b{display:block;font-size:15.5px;font-weight:600}.pri .t small{opacity:.7;font-size:12.5px}
.pri.alt{background:var(--paper2);color:var(--ink);border:1px solid var(--line)}.pri.alt .t small{color:var(--ink2);opacity:1}
.row{display:flex;gap:10px;margin-bottom:10px}.row .pri{margin:0;padding:14px}
.sec{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:22px 2px 10px}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-radius:var(--r);background:var(--paper2);border:1px solid var(--line);margin-bottom:9px;transition:transform .12s;position:relative}
.card:active{transform:scale(.985)}.card .g{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--sel)}
.card .b{flex:1;min-width:0}.card .b b{display:block;font-size:15px;font-weight:600}.card .b small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px;line-height:1.35}
.card .arrow{color:var(--ink3);font-size:18px}.card.dim{opacity:.55}
.mini-enso{width:34px;height:34px;flex:none}.mini-enso svg{width:100%;height:100%;transform:rotate(-90deg)}.mini-enso .c{fill:none;stroke:var(--line2);stroke-width:4}.mini-enso .p{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}.mini-enso.full .p{stroke:var(--seal)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;letter-spacing:.04em;border:1px solid var(--line2);color:var(--ink2);margin-left:6px;vertical-align:middle}
.tag.seal{border-color:var(--seal);color:var(--seal)}.tag.gold{border-color:var(--gold);color:var(--gold)}.tag.ok{border-color:var(--ok);color:var(--ok)}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kc{aspect-ratio:1;border-radius:16px;background:var(--paper2);border:1px solid var(--line);display:grid;place-items:center;font-size:36px;position:relative;transition:transform .12s}
.kc:active{transform:scale(.94)}.kc small{position:absolute;bottom:5px;right:8px;font-size:9.5px;color:var(--ink3);font-family:-apple-system,system-ui}
.kc em{position:absolute;top:5px;left:8px;font-size:9.5px;color:var(--ink3);font-style:normal;font-family:-apple-system,system-ui}
.kc.l1{border-color:var(--ko)}.kc.l1 small{color:var(--ko)}.kc.l2{border-color:var(--gold)}.kc.l2 small{color:var(--gold)}.kc.l3{border-color:var(--ok)}.kc.l3 small{color:var(--ok)}
.kc.l4{border-color:var(--seal);background:var(--sel)}.kc.l4 small{color:var(--seal)}.kc.l4::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--seal)}
.kc.future{opacity:.4}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--ink2);padding:12px 2px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle;border:1px solid var(--line2)}
.fiche{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.kbox{width:min(62vw,240px);aspect-ratio:1;border-radius:26px;background:var(--paper2);border:1px solid var(--line);position:relative;box-shadow:var(--sh)}
.kbox svg{width:100%;height:100%;display:block}.kbox .gl{fill:none;stroke:var(--line2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.kbox .st{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}.kbox .st.hi{stroke:var(--seal)}.kbox .st.ok{stroke:var(--ok)}
.kbox .num{font-size:7px;fill:var(--seal);font-family:-apple-system,system-ui;font-weight:700}
.kbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:26px}.kbox .grid-l{stroke:var(--line);stroke-width:.6;stroke-dasharray:3 3}
.kmeta{text-align:center;margin-top:12px}.kmeta .fr{font-size:20px;font-weight:600}.kmeta .n{font-size:12px;color:var(--ink3);margin-top:2px;letter-spacing:.06em}
.readings{display:flex;gap:10px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.rd{padding:8px 14px;border-radius:12px;background:var(--paper2);border:1px solid var(--line);font-size:15px}.rd b{font-size:10px;letter-spacing:.1em;color:var(--ink3);display:block;margin-bottom:2px;font-weight:600}
.tools{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.tb{padding:9px 14px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;color:var(--ink);background:var(--paper2)}.tb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vlist{width:100%;margin-top:6px}
.vi{display:flex;align-items:baseline;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.vi .w{font-size:20px;min-width:88px;line-height:1.4}.vi .w rt{font-size:9px;color:var(--ink2)}.vi .r{font-size:12px;color:var(--ink2)}
.vi .f{flex:1;font-size:14px;color:var(--ink);line-height:1.35}.vi .f.empty{color:var(--ink3);font-style:italic}.vi .st{color:var(--seal);font-size:14px}.vi .unk{color:var(--ink3);font-size:11px}
.vi .te{font-size:12px;color:var(--gold)}.vi .te b{font-size:9px;letter-spacing:.1em;color:var(--ink3);font-weight:600}
.notseen{color:var(--seal2);text-decoration:underline dotted;text-underline-offset:3px}
.hint{color:var(--ink2);font-size:13px;text-align:center;margin-top:10px;line-height:1.45;padding:0 12px;min-height:18px}
.spk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sel);color:var(--ink2);font-size:13px;vertical-align:middle;flex:none;transition:transform .1s,background .12s}
.spk:active{transform:scale(.9);background:var(--line2)}.spk.big{width:58px;height:58px;font-size:24px;background:var(--ink);color:var(--paper)}
.rv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 18px}
.rcard{width:100%;max-width:400px;min-height:210px;border-radius:24px;background:var(--paper2);border:1px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;position:relative;text-align:center;transition:transform .12s}
.rcard.ko{animation:shake .32s}@keyframes shake{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
.rcard .kind{position:absolute;top:12px;left:0;right:0;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.rcard .big{font-size:clamp(64px,22vw,96px);line-height:1.1}.rcard .mid{font-size:34px;line-height:1.3}.rcard .fr{font-size:22px;font-weight:600;line-height:1.3}
.rcard .sub{color:var(--ink2);font-size:15px;margin-top:8px;line-height:1.45}.rcard .ans{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2);width:100%}
.seal{position:absolute;right:14px;bottom:12px;width:52px;height:52px;border-radius:50%;border:3px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-size:20px;font-weight:700;transform:scale(0) rotate(-12deg);opacity:0;pointer-events:none}
.seal.on{animation:stamp .45s cubic-bezier(.2,1.4,.4,1) forwards}@keyframes stamp{0%{transform:scale(1.6) rotate(-12deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:.95}}
.ink{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:var(--ko);opacity:0;transform:translate(-50%,-50%) scale(0);pointer-events:none;filter:blur(6px)}
.ink.on{animation:blot .7s ease-out forwards}@keyframes blot{0%{transform:translate(-50%,-50%) scale(0);opacity:.55}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px;margin-top:14px}
.opt{padding:16px 10px;border-radius:16px;background:var(--paper2);border:1px solid var(--line);font-size:15px;text-align:center;line-height:1.3;transition:transform .1s,background .12s;display:flex;align-items:center;justify-content:center;min-height:60px}
.opt.jp{font-size:22px}.opt:active{transform:scale(.97)}.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}.opt.dim{opacity:.35}
.opt svg{width:76px;height:76px}.opt .gl{fill:none;stroke:var(--line2);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.opt .st{fill:none;stroke:var(--seal);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.opt.ok .gl,.opt.ko .gl{stroke:rgba(255,255,255,.5)}.opt.ok .st,.opt.ko .st{stroke:#fff}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:400px;margin-top:14px}
.grade button{padding:15px 6px;border-radius:16px;border:1px solid var(--line);background:var(--paper2);font-size:14px;font-weight:600;text-align:center}.grade .g0{color:var(--ko)}.grade .g1{color:var(--gold)}.grade .g2{color:var(--ok)}
.reveal{width:100%;max-width:400px;margin-top:14px;padding:16px;border-radius:16px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;text-align:center}
.builder{width:100%;max-width:400px;margin-top:14px}
.slot{min-height:64px;border-radius:16px;border:1.5px dashed var(--line2);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper2)}.slot.ok{border-color:var(--ok)}.slot.ko{border-color:var(--ko)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.tk{padding:10px 14px;border-radius:12px;background:var(--paper2);border:1px solid var(--line2);font-size:19px;transition:transform .1s;line-height:1.2}.tk:active{transform:scale(.95)}.tk.used{opacity:.25;pointer-events:none}.slot .tk{background:var(--sel)}
.kbd{width:100%;max-width:400px;margin-top:14px}.kbd input{width:100%;padding:16px;border-radius:16px;border:1.5px solid var(--line2);background:var(--paper2);font-size:22px;text-align:center}.kbd input.ok{border-color:var(--ok)}.kbd input.ko{border-color:var(--ko)}
.prog{height:3px;background:var(--line);margin:0 18px;border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .35s}
.sub{display:flex;justify-content:space-between;padding:8px 20px;font-size:12.5px;color:var(--ink2);min-height:32px}.sub b{color:var(--ink);font-weight:600}
.end{text-align:center;padding:30px 20px}.end .big{font-size:56px;font-weight:600}.end p{color:var(--ink2);margin:10px 0 22px;line-height:1.55}
.pt{padding:16px;border-radius:var(--r);background:var(--paper2);border:1px solid var(--line);margin-bottom:12px}.pt h3{font-size:16px;font-weight:600;margin-bottom:6px}
.pt .why{color:var(--ink2);font-size:13.5px;line-height:1.5;margin-bottom:10px}.ex{padding:9px 0;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
.ex .j{font-size:19px;line-height:1.55;flex:1}.ex .f{font-size:13px;color:var(--ink2);margin-top:2px}
.field{margin-bottom:10px}.field label{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.field input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--paper2);font-size:16px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--ink);color:var(--paper);font-size:15.5px;font-weight:600;text-align:center;margin-top:8px}.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line2)}.btn.s{background:var(--seal);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;background:var(--paper2);border:1px solid var(--line);margin-bottom:8px;width:100%;font-size:15px}.tog small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.sw{width:44px;height:26px;flex:none;border-radius:13px;background:var(--line2);position:relative;transition:background .15s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on .sw{background:var(--seal)}.tog.on .sw::after{left:21px}
.about p{font-size:15px;line-height:1.6;margin-bottom:12px}.about h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:20px 0 6px}.about a{color:var(--seal);text-decoration:none;font-weight:600}
.toast{position:fixed;left:18px;right:18px;top:calc(10px + env(safe-area-inset-top));background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;z-index:30;transform:translateY(-140%);transition:transform .32s cubic-bezier(.2,.9,.3,1);text-align:center;font-size:14px}.toast.on{transform:none}
.loading{flex:1;display:grid;place-items:center;color:var(--ink2);font-size:14px;text-align:center;padding:20px;line-height:1.5}
.cal{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}.cal i{width:12px;height:12px;border-radius:4px;border:1px solid var(--line2)}.cal i.on{background:var(--seal);border-color:var(--seal)}
.bloc{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}.bloc h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}.bloc span{flex:1;height:1px;background:var(--line)}.bloc b{font-size:12px;color:var(--ink3);font-weight:500}
.step{display:flex;gap:5px;justify-content:center;margin:2px 0 8px}.step i{width:22px;height:3px;border-radius:2px;background:var(--line2)}.step i.on{background:var(--ink)}.step i.done{background:var(--seal)}
.blob{text-align:center;padding:26px 16px}.blob .lab{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}.blob h2{font-size:26px;font-weight:600;margin:8px 0 6px}.blob p{color:var(--ink2);font-size:14px;line-height:1.5}.blob .ks{font-size:30px;letter-spacing:.14em;margin:16px 0 4px;line-height:1.5}
.comp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.comp .cp{padding:8px 12px;border-radius:12px;background:var(--paper2);border:1px solid var(--line);font-size:22px;line-height:1.2;text-align:center}.comp .cp small{display:block;font-size:10px;color:var(--ink3);font-family:-apple-system,system-ui;margin-top:2px}.comp .cp.rad{border-color:var(--seal);color:var(--seal)}
.cloze{font-size:34px;letter-spacing:.06em;line-height:1.5}.cloze .hole{display:inline-block;min-width:44px;border-bottom:3px solid var(--seal);color:var(--seal)}
.exam{padding:2px 0}.exam .q{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:center;margin-bottom:4px}
.res{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.res .bar{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}.res .bar i{display:block;height:100%;border-radius:4px}.res .lb{font-size:13.5px;min-width:120px}.res .pc{font-size:13px;color:var(--ink2);min-width:52px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line2);font-size:13px;background:var(--paper2)}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.chip.dim{opacity:.4}
.timer{font-variant-numeric:tabular-nums;font-weight:600}.timer.warn{color:var(--ko)}
.wk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}.wk .k{font-size:26px;min-width:40px}.wk .m{flex:1;font-size:13.5px}.wk .m small{display:block;color:var(--ink2);font-size:12px}
.lives{display:flex;gap:6px;justify-content:center}.lives i{width:12px;height:12px;border-radius:50%;background:var(--seal)}.lives i.off{background:var(--line2)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;width:100%;max-width:400px;margin:6px 0}.duel .side{text-align:center;padding:12px;border-radius:14px;background:var(--paper2);border:1px solid var(--line)}.duel .side b{font-size:26px;display:block}.duel .side small{color:var(--ink2);font-size:12px}.duel .vs{color:var(--ink3);font-size:12px;letter-spacing:.1em}
.rt{display:grid;grid-template-columns:34px 44px 1fr 1fr;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}.rt .c{font-size:24px}.rt small{color:var(--ink2)}
.srch{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--paper2);font-size:15px;margin-bottom:10px}
.pos7{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.pos7 div{text-align:center;font-size:11px;color:var(--ink2)}.pos7 svg{width:100%;aspect-ratio:1;display:block;margin-bottom:4px}.pos7 rect{fill:var(--line);stroke:var(--line2)}.pos7 rect.k{fill:var(--seal2)}

<body>
<div id="app">
  <div class="hd"><button class="ib hidden" id="back">‹</button><h1 id="title">言葉</h1><button class="ib" id="themeBtn" aria-label="Thème">◐</button><button class="ib" id="setBtn" aria-label="Réglages">⚙︎</button></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="sub"><span id="subL"></span><span id="subR"></span></div>
  <div class="view" id="view"><div class="loading">Chargement…</div></div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ═══════ ÉTAT ═══════ */
const $=id=>document.getElementById(id);
const KEY='kotoba-v1', DAY=864e5;
let D={manifest:null,kanji:{},gram:{},strokes:{},comp:{},cloze:[],read:[],cles:[],coursCles:null,lex:{verbs:[],adjs:[]}};
let S={srs:{},opt:{theme:'jour',furi:false,newPerDay:8,audio:true,autoSpeak:false,games:true,modes:{reco:true,rappel:true,lecture:true,phrase:true,trou:true,clavier:false,ecoute:true,te:true,contraire:true,cle:true}},perso:[],log:{},unlocked:{},best:{}};
let nav=[],cur={};
function load(){ try{ const v=localStorage.getItem(KEY); if(v){ const d=JSON.parse(v); S.srs=d.srs||{}; S.opt=Object.assign(S.opt,d.opt||{}); S.opt.modes=Object.assign({reco:true,rappel:true,lecture:true,phrase:true,trou:true,clavier:false,ecoute:true,te:true,contraire:true,cle:true},d.opt&&d.opt.modes||{}); S.perso=d.perso||[]; S.log=d.log||{}; S.unlocked=d.unlocked||{}; S.best=d.best||{}; } }catch(e){} }
let sT; function save(){ clearTimeout(sT); sT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify({srs:S.srs,opt:S.opt,perso:S.perso,log:S.log,unlocked:S.unlocked,best:S.best})); }catch(e){} },200); }
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>sh(a).slice(0,n);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toast(t){ $('toast').textContent=t; $('toast').classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>$('toast').classList.remove('on'),2600); }
function vib(p){ try{navigator.vibrate&&navigator.vibrate(p)}catch(e){} }
function fdate(s){ if(!s) return ''; const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ═══════ AUDIO ═══════ */
const TTS={voice:null,ok:false,tried:false,
  init(){ if(!('speechSynthesis' in window)) return; const pick=()=>{ const vs=speechSynthesis.getVoices()||[]; TTS.voice=vs.find(v=>/^ja/i.test(v.lang)&&/Kyoko|Google|O-Ren|Hattori|Otoya/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null; TTS.ok=!!TTS.voice; TTS.tried=true; };
    pick(); try{ speechSynthesis.onvoiceschanged=pick; }catch(e){} setTimeout(pick,800); },
  speak(t,rate){ if(!S.opt.audio||!t) return false; if(!TTS.ok){ TTS.init(); if(!TTS.ok) return false; } try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.voice=TTS.voice; u.rate=rate||.88; u.pitch=1; speechSynthesis.speak(u); return true; }catch(e){ return false; } }
};
const spk=(t,big)=>(S.opt.audio&&TTS.ok)?`<button class="spk${big?' big':''}" data-say="${esc(t)}" aria-label="Écouter">${big?'🔊':'🔈'}</button>`:'';
document.addEventListener('click',e=>{ const b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); TTS.speak(b.dataset.say); } });
const sayable=t=>String(t).replace(/[（(].*?[）)]/g,'').split(/[／/]/)[0].replace(/[〜~*]/g,'').trim();

/* ═══════ DONNÉES ═══════ */
async function loadData(){
  const m=await (await fetch('data/manifest.json',{cache:'no-store'})).json(); D.manifest=m;
  const J=(u,f)=>fetch(u).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(f).catch(()=>{});
  const jobs=[];
  m.cours.kanji.seances.forEach(s=>jobs.push(J('data/kanji/'+s.id+'.json',j=>D.kanji[s.id]=j)));
  m.cours.grammaire.lecons.forEach(l=>jobs.push(J('data/grammaire/'+l.id+'.json',j=>D.gram[l.id]=j)));
  jobs.push(J('data/grammaire/_lexique.json',j=>D.lex=j));
  jobs.push(J('data/strokes.json',j=>D.strokes=j)); jobs.push(J('data/components.json',j=>D.comp=j));
  jobs.push(J('data/cloze.json',j=>D.cloze=j)); jobs.push(J('data/readings.json',j=>D.read=j));
  jobs.push(J('data/cles.json',j=>D.cles=j)); jobs.push(J('data/cours_cles.json',j=>D.coursCles=j));
  await Promise.all(jobs); index();
}
let KANJI=[],VOCAB=[],SENT=[],BYK={},CLOZE=[],READS=[],VERBS=[],ADJS=[],CLEBY={};
function index(){
  KANJI=[];VOCAB=[];SENT=[];BYK={};
  Object.values(D.kanji).sort((a,b)=>a.range[0]-b.range[0]).forEach(s=>{ s.kanji.forEach(k=>{ k.seance=s.id; k.date=s.date; KANJI.push(k); BYK[k.k]=k;
    k.vocab.forEach(v=>VOCAB.push({...v,kanji:k.k,seance:s.id,id:'v:'+v.w+'/'+v.r,src:'kanji'})); }); });
  Object.values(D.gram).forEach(g=>{
    (g.vocab||[]).forEach(e=>{ const [w,fr,r,pos]=Array.isArray(e)?e:[e.w,e.fr,e.r,e.pos]; VOCAB.push({w,r:r||'',fr,pos:pos||'',star:true,seance:g.id,id:'v:'+w+'/'+g.id,src:'gram'}); });
    g.points.forEach((p,pi)=>p.ex.forEach((e,ei)=>{ if(e.tok&&e.tok.length>1) SENT.push({...e,id:'s:'+g.id+':'+pi+':'+ei,lecon:g.id,point:p.t}); }));
  });
  S.perso.forEach(p=>VOCAB.push({w:p.w,r:p.r,fr:p.fr,star:false,seance:'perso',id:'v:perso:'+p.w,src:'perso'}));
  CLOZE=(D.cloze||[]).filter(c=>D.kanji[c.seance]); READS=(D.read||[]).filter(r=>D.kanji[r.seance]);
  VERBS=(D.lex.verbs||[]).map(v=>({...v,id:'te:'+v.w,lecon:v.les?'L'+String(v.les).padStart(2,'0'):null}));
  ADJS=(D.lex.adjs||[]).map(a=>({...a,id:'adj:'+a.w,lecon:'L'+String(a.les).padStart(2,'0')}));
  CLEBY={}; (D.cles||[]).forEach(c=>CLEBY[c.n]=c);
}
const unlocked=id=>{ const d=D.kanji[id]||D.gram[id]; if(!d) return true; if(S.unlocked[id]) return true; return !!d.date&&d.date<=today(); };
const kanjiSeen=k=>{ const x=BYK[k]; return x?unlocked(x.seance):true; };
const cleOf=k=>{ const c=(D.comp||{})[k]; return c&&c.cle?CLEBY[c.cle]:null; };

/* ═══════ SRS ═══════ */
const st=id=>S.srs[id]||null;
const isDue=id=>{ const s=st(id); return s&&s.due<=Date.now(); };
function grade(id,g,w){ // g: 0 raté 1 dur 2 facile ; w: poids (jeux)
  let s=S.srs[id]||{iv:0,ease:2.3,reps:0,lapses:0};
  if(g===0){ s.iv=0; s.lapses++; s.ease=Math.max(1.3,s.ease-.2); s.due=Date.now()+10*60e3; }
  else if(g===1){ s.iv=Math.max(1,Math.round(s.iv*1.2)||1); s.ease=Math.max(1.3,s.ease-.12); s.due=Date.now()+s.iv*DAY; }
  else { const nxt=s.iv===0?1:s.iv===1?3:Math.round(s.iv*s.ease); s.iv=w&&w<1?Math.max(s.iv,Math.round(s.iv+(nxt-s.iv)*w)):nxt; s.ease=Math.min(2.8,s.ease+.05); s.due=Date.now()+s.iv*DAY; }
  s.reps++; s.last=Date.now(); S.srs[id]=s; const t=today(); S.log[t]=(S.log[t]||0)+1; save();
}
const lvl=id=>{ const s=st(id); if(!s) return 0; if(s.iv<3) return 1; if(s.iv<10) return 2; if(s.iv<30) return 3; return 4; };
const kanjiLevel=k=>lvl('k:'+k);
const flowOf=v=>v.star===false?'enrich':'exam';
function poolItems(){
  const it=[], M=S.opt.modes;
  KANJI.forEach(k=>{ if(kanjiSeen(k.k)) it.push({id:'k:'+k.k,type:'kanji',k,flow:'exam'}); });
  VOCAB.forEach(v=>{ if(v.seance==='perso'||unlocked(v.seance)) it.push({id:v.id,type:'vocab',v,flow:flowOf(v)}); });
  if(M.phrase) SENT.forEach(s=>{ if(unlocked(s.lecon)) it.push({id:s.id,type:'sent',s,flow:'exam'}); });
  if(M.trou) CLOZE.forEach(c=>{ if(unlocked(c.seance)) it.push({id:c.id,type:'cloze',c,flow:c.star===false?'enrich':'exam'}); });
  if(M.lecture) READS.forEach(r=>{ if(unlocked(r.seance)) it.push({id:r.id,type:'read',r,flow:r.star===false?'enrich':'exam'}); });
  if(M.te) VERBS.forEach(v=>{ if(v.te&&(!v.lecon||unlocked(v.lecon))) it.push({id:v.id,type:'te',v,flow:'exam'}); });
  if(M.contraire) ADJS.forEach(a=>{ if(a.opp.length&&unlocked(a.lecon)) it.push({id:a.id,type:'opp',a,flow:'exam'}); });
  if(M.cle) KANJI.forEach(k=>{ const c=cleOf(k.k); if(c&&kanjiSeen(k.k)&&!(D.comp[k.k]||{}).self) it.push({id:'cle:'+k.k,type:'cle',k,c,flow:'enrich'}); });
  return it;
}
function dueLists(){ const all=poolItems(), due=all.filter(i=>isDue(i.id)), fresh=all.filter(i=>!st(i.id));
  return {all,due,fresh,dueExam:due.filter(i=>i.flow==='exam'),dueEnrich:due.filter(i=>i.flow==='enrich'),freshExam:fresh.filter(i=>i.flow==='exam'),freshEnrich:fresh.filter(i=>i.flow==='enrich')}; }
function pickNew(list,n){ const by=t=>list.filter(i=>i.type===t); const k=by('kanji').sort((a,b)=>a.k.n-b.k.n), v=by('vocab'), s=by('sent'), o=list.filter(i=>!['kanji','vocab','sent'].includes(i.type));
  const out=[]; let i=0; while(out.length<n&&(k[i]||v[i]||s[i]||o[i])){ if(k[i]) out.push(k[i]); if(v[i]&&out.length<n) out.push(v[i]); if(s[i]&&out.length<n&&i%2===0) out.push(s[i]); if(o[i]&&out.length<n&&i%3===0) out.push(o[i]); i++; } return out; }

/* ═══════ NAVIGATION ═══════ */
function go(fn,arg){ nav.push([fn,arg]); render(); }
function back(){ if(nav.length>1) nav.pop(); render(); }
function home_(){ nav=[[home]]; render(); }
function render(){ cur.stop&&cur.stop(); cur={id:Math.random()}; const [fn,arg]=nav[nav.length-1]; $('view').innerHTML=''; $('back').classList.toggle('hidden',nav.length<=1); setBar(0); info('',''); try{ speechSynthesis&&speechSynthesis.cancel(); }catch(e){} fn(arg); }
$('back').onclick=back;
function later(fn,ms){ const my=cur.id; setTimeout(()=>{ if(cur.id===my) fn(); },ms); }
function head(t,s){ $('title').innerHTML=t+(s?'<small>'+s+'</small>':''); }
function info(l,r){ $('subL').innerHTML=l; $('subR').innerHTML=r; }
function setBar(p){ $('bar').style.width=(Math.max(0,Math.min(1,p))*100)+'%'; }
function ensoSVG(p){ const r=44,c=2*Math.PI*r; return `<svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="${r}"/><circle class="p" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,p)))}"/></svg>`; }
const rubyW=(w,r)=>S.opt.furi&&r&&r!==w?`<ruby>${w}<rt>${r}</rt></ruby>`:w;
const markUnseen=w=>[...w].map(ch=>(BYK[ch]&&!kanjiSeen(ch))?`<span class="notseen" title="vu en ${BYK[ch].seance}">${ch}</span>`:ch).join('');
const stamp=(el,good)=>{ if(!el) return; const s=document.createElement('div'); s.className=good?'seal':'ink'; s.textContent=good?'正':''; el.appendChild(s); requestAnimationFrame(()=>s.classList.add('on')); if(!good) el.classList.add('ko'); vib(good?12:[30,30,30]); };

/* ═══════ TRACÉ ═══════ */
function parsePath(d){ const toks=d.match(/[MmCcLlSsHhVvZz]|-?\d*\.?\d+(?:e-?\d+)?/g); let i=0,x=0,y=0,cmd='',pts=[],start=null; const num=()=>parseFloat(toks[i++]);
  while(i<toks.length){ const t=toks[i]; if(/[A-Za-z]/.test(t)){cmd=t;i++;}
    if(cmd==='M'){x=num();y=num();cmd='L';} else if(cmd==='m'){x+=num();y+=num();cmd='l';}
    else if(cmd==='C'){num();num();num();num();x=num();y=num();} else if(cmd==='c'){num();num();num();num();x+=num();y+=num();}
    else if(cmd==='S'){num();num();x=num();y=num();} else if(cmd==='s'){num();num();x+=num();y+=num();}
    else if(cmd==='L'){x=num();y=num();} else if(cmd==='l'){x+=num();y+=num();}
    else if(cmd==='H'){x=num();} else if(cmd==='h'){x+=num();} else if(cmd==='V'){y=num();} else if(cmd==='v'){y+=num();}
    else {i++;continue;}
    if(!start) start=[x,y]; pts.push([x,y]); }
  return {start,end:pts[pts.length-1],pts}; }
function miniKanji(k,hi){ const p=D.strokes[k]||[]; return `<svg viewBox="0 0 109 109">${p.map((d,i)=>`<path class="${i===hi?'st':'gl'}" d="${d}"/>`).join('')}</svg>`; }
function drawKanji(box,k,o={}){ const paths=D.strokes[k]||[], n=o.upto==null?paths.length:o.upto;
  let svg=`<svg viewBox="0 0 109 109"><line class="grid-l" x1="54.5" y1="4" x2="54.5" y2="105"/><line class="grid-l" x1="4" y1="54.5" x2="105" y2="54.5"/>`;
  if(o.ghost!==false) paths.forEach(d=>svg+=`<path class="gl" d="${d}"/>`);
  paths.slice(0,n).forEach((d,i)=>svg+=`<path class="st${o.highlight===i?' hi':''}${o.done&&o.done.has(i)?' ok':''}" d="${d}" ${o.animate?'data-anim="1"':''}/>`);
  if(o.numbers) paths.forEach((d,i)=>{ const p=parsePath(d).start; svg+=`<text class="num" x="${Math.min(100,p[0]+2)}" y="${Math.max(9,p[1]-2)}">${i+1}</text>`; });
  svg+='</svg>'; box.innerHTML=svg;
  if(o.animate){ const els=[...box.querySelectorAll('path.st')]; let t=0;
    els.forEach(el=>{ let L=100; try{ L=el.getTotalLength(); }catch(e){} el.style.strokeDasharray=L; el.style.strokeDashoffset=L; el.style.transition='none';
      setTimeout(()=>{ el.style.transition=`stroke-dashoffset ${Math.max(.25,L/140)}s ease-out`; el.style.strokeDashoffset=0; },t); t+=Math.max(250,L/140*1000)+120; });
    return t; } return 0; }
function traceEngine(box,k,onDone,onProgress){
  const paths=D.strokes[k]||[]; let i=0,drawing=false,pts=[],err=0;
  const cv=document.createElement('canvas'); const c=cv.getContext('2d');
  const fit=()=>{ const r=cv.getBoundingClientRect(),dp=devicePixelRatio||1; cv.width=r.width*dp;cv.height=r.height*dp; c.setTransform(dp,0,0,dp,0,0); c.lineWidth=Math.max(6,r.width/26); c.lineCap='round';c.lineJoin='round'; c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000'; };
  const wrap=()=>box.querySelector('.svgwrap')||box;
  const toUnit=p=>{ const r=cv.getBoundingClientRect(); return [p[0]/r.width*109,p[1]/r.height*109]; };
  const pos=e=>{ const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e; return [t.clientX-r.left,t.clientY-r.top]; };
  const redraw=(hl)=>{ drawKanji(wrap(),k,{upto:hl!=null?hl+1:i,highlight:hl,done:new Set([...Array(i).keys()]),ghost:true}); box.appendChild(cv); setTimeout(fit,10); };
  const start=e=>{ if(i>=paths.length)return; e.preventDefault(); drawing=true; pts=[pos(e)]; c.beginPath(); c.moveTo(...pts[0]); };
  const move=e=>{ if(!drawing)return; e.preventDefault(); const p=pos(e); pts.push(p); c.lineTo(...p); c.stroke(); };
  const end=()=>{ if(!drawing)return; drawing=false; c.clearRect(0,0,cv.width,cv.height); if(pts.length<2) return;
    const exp=parsePath(paths[i]); const a=toUnit(pts[0]),b=toUnit(pts[pts.length-1]); const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
    let len=0; for(let j=1;j<pts.length;j++) len+=dist(toUnit(pts[j-1]),toUnit(pts[j])); let elen=0; for(let j=1;j<exp.pts.length;j++) elen+=dist(exp.pts[j-1],exp.pts[j]);
    const okS=dist(a,exp.start)<14, okE=dist(b,exp.end)<16, okL=elen<8?len<25:(len>elen*.45&&len<elen*2.2);
    if(okS&&okE&&okL){ i++; vib(12); redraw(); onProgress&&onProgress(i,paths.length,err); if(i>=paths.length) onDone&&onDone(err); }
    else { err++; vib([30,30,30]); const wrongDir=dist(a,exp.end)<14&&dist(b,exp.start)<16;
      onProgress&&onProgress(i,paths.length,err,wrongDir?'Bon trait, mais dans le mauvais sens.':(!okS?'Le trait ne part pas du bon endroit.':'Le trait ne finit pas au bon endroit.')); redraw(i); } };
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);cv.addEventListener('touchcancel',end);
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);addEventListener('mouseup',end);
  redraw();
  return {reset(){i=0;err=0;redraw();},get index(){return i;},get total(){return paths.length;},showStroke(j){redraw(j);}}; }
/* quiz "trait n°N" avec réponses visuelles */
function strokeOptions(k,target){ const n=(D.strokes[k]||[]).length; const others=pick([...Array(n).keys()].filter(i=>i!==target),3); return sh([target,...others]); }
/* ═══════ CARTES (moteur de questions) ═══════ */
/* Chaque carte : rendu dans #view, appelle cb(good, g) où g = 0/1/2. opts: {first} */
const CARDS={};
function stageQ(kind,body,extra){ $('view').innerHTML=`<div class="rv"><div class="rcard"><div class="kind">${kind}</div>${body}</div>${extra||''}</div>`; return document.querySelector('.rcard'); }
function optsBox(list,render,cb,cls){ const box=document.createElement('div'); box.className='opts'; let lock=false;
  list.forEach(o=>{ const b=document.createElement('button'); b.className='opt '+(cls||''); b.innerHTML=render(o.v); b.dataset.i=o.i;
    b.onclick=()=>{ if(lock)return; lock=true; const good=o.ok; [...box.children].forEach(x=>{ if(list[+x.dataset.i]&&list[+x.dataset.i].ok) x.classList.add('ok'); else x.classList.add('dim'); }); if(!good){ b.classList.remove('dim'); b.classList.add('ko'); } cb(good); };
    box.appendChild(b); });
  return box; }
const mk=(vals,okIdx)=>vals.map((v,i)=>({v,ok:i===okIdx,i}));
function distinct(arr,key){ const s=new Set(),o=[]; arr.forEach(x=>{ const k=key(x); if(!s.has(k)){s.add(k);o.push(x);} }); return o; }

CARDS.kanji=(it,cb,o)=>{ const k=it.k, first=o&&o.first;
  const card=stageQ(first?'nouveau kanji':'kanji',`<div class="big jp">${k.k}</div><div class="sub">${k.strokes} traits · n°${k.n}</div><div class="ans hidden" id="ans"><div class="fr">${k.fr}</div><div class="sub jps">${k.on.length?'ON '+k.on.join('・'):''}${k.kun.length?(k.on.length?' · ':'')+'kun '+k.kun.join('・'):''}</div></div>`,
    `<button class="reveal" id="rv">Lecture et sens</button><div class="grade hidden" id="gr"><button class="g0">Raté</button><button class="g1">Difficile</button><button class="g2">Facile</button></div>`);
  $('rv').onclick=()=>{ $('ans').classList.remove('hidden'); $('rv').classList.add('hidden'); $('gr').classList.remove('hidden'); };

/* rendu générique d'un item selon un angle */
function renderItem(it,angle,cb,o){
  o=o||{};
  switch(angle||it.type){
    case 'kanji': return CARDS.kanji(it,cb,o);
    case 'ksens': return CARDS.ksens(it,cb);
    case 'kcle': { const c=cleOf(it.k.k); if(!c) return CARDS.ksens(it,cb); return CARDS.kcle({...it,c},cb); }
    case 'stroke': return CARDS.stroke(it,cb);
    case 'count': return CARDS.count(it,cb);
    case 'vocab': case 'reco': return CARDS.vocab(it,cb,{first:o.first,mode:'reco'});
    case 'rappel': return CARDS.vocab(it,cb,{mode:'rappel'});
    case 'clavier': return CARDS.vocab(it,cb,{mode:'clavier'});
    case 'listen': return TTS.ok?CARDS.listen(it,cb,{mode:'sens'}):CARDS.vocab(it,cb,{mode:'reco'});
    case 'listenw': return TTS.ok?CARDS.listen(it,cb,{mode:'ecriture'}):CARDS.vocab(it,cb,{mode:'rappel'});
    case 'dictee': return TTS.ok?CARDS.dictee(it,cb):CARDS.vocab(it,cb,{mode:'clavier'});
    case 'cloze': return CARDS.cloze(it,cb);
    case 'read': return CARDS.read(it,cb,o);
    case 'lecture2': return CARDS.lecture2(it,cb);
    case 'sent': return CARDS.sent(it,cb);
    case 'te': return CARDS.te(it,cb,o);
    case 'opp': return CARDS.opp(it,cb);
    case 'cle': return CARDS.kcle(it,cb);
    case 'clesens': return CARDS.clesens(it,cb);
    default: return CARDS.vocab(it,cb,o);
  }
}
/* angles possibles pour un item (quiz multi-angles) */
function anglesFor(it){
  const A=[]; const M=S.opt.modes, hasAudio=TTS.ok&&M.ecoute;
  if(it.type==='kanji'){ A.push('ksens','stroke','count'); if(cleOf(it.k.k)&&!(D.comp[it.k.k]||{}).self) A.push('kcle'); }
  else if(it.type==='vocab'){ A.push('reco'); if(!it.v.kana) A.push('rappel'); if(M.clavier&&it.v.r) A.push('clavier'); if(hasAudio&&it.v.r){ A.push('listen'); if(!it.v.kana) A.push('listenw'); } if(hasAudio&&M.clavier&&it.v.r) A.push('dictee'); }
  else if(it.type==='read'){ A.push('read','lecture2'); if(M.clavier) A.push('clavier'); }
  else if(it.type==='cloze') A.push('cloze'); else if(it.type==='sent') A.push('sent');
  else if(it.type==='te'){ A.push('te'); if(M.clavier) A.push('te'); } else if(it.type==='opp') A.push('opp'); else if(it.type==='cle') A.push('cle');
  return A; }
/* ═══════ SESSION (révision) ═══════ */
function session({items,label,onEnd,free,weight}){
  let q=items.slice(), i=0, total=q.length, ok=0, ko=0; const again=[];
  head(label||'Révision',free?'ne compte pas dans la progression':'');
  const next=()=>{ if(!q.length){ if(again.length&&!free) q=sh(again.splice(0)); else { fin(); return; } }
    const it=q.shift(); info(`<b>${i}</b> / ${total}`,ko?'raté '+ko:''); setBar(i/Math.max(total,1));
    const first=!st(it.id);
    let angle=it.angle||null;
    if(!angle){ if(it.type==='vocab'){ const A=anglesFor(it).filter(a=>a!=='reco'||true); angle=first?'reco':(A.length?A[Math.random()*A.length|0]:'reco'); }
      else if(it.type==='read'&&S.opt.modes.clavier&&!first&&Math.random()<.4) angle='clavier'; else if(it.type==='te'&&S.opt.modes.clavier&&!first&&Math.random()<.5) return renderItem(it,'te',(g,gr)=>done(it,g,gr),{mode:'clavier'}); }
    renderItem(it,angle,(g,gr)=>done(it,g,gr),{first}); };
  const done=(it,good,g)=>{ if(!free) grade(it.id,g,weight); i++; if(!good){ ko++; if(!free) again.push(it); } else ok++; later(next,good?520:950); };
  const fin=()=>{ setBar(1); info('',''); $('view').innerHTML=`<div class="end"><div class="big jp">${ko===0?'完':'了'}</div><p>${total} carte${total>1?'s':''} · ${ok} réussie${ok>1?'s':''} · ${ko} à revoir<br>${free?'Session libre, rien n\'a été enregistré.':ko===0?'Sans faute.':'Les ratés reviennent dans dix minutes.'}</p><button class="btn" id="bk">Terminer</button></div>`;
    $('bk').onclick=()=>{ if(onEnd) onEnd(); else home_(); }; };
  next(); }

function fiche(k){ const x=BYK[k]; head(`<span class="jp">${k}</span> · ${x.fr}`,`n°${x.n} · ${x.seance} · ${x.strokes} trait${x.strokes>1?'s':''}`);

    ${(c.parts&&c.parts.length)||cl?`<div class="comp">${(c.parts||[]).map(p=>`<span class="cp jp ${p===c.rad?'rad':''}">${p}${p===c.rad&&cl?`<small>${cl.nom||cl.r} · ${cl.fr.toLowerCase()}</small>`:''}</span>`).join('')}${(!c.parts||!c.parts.length)&&cl?`<span class="cp jp rad">${cl.c}<small>${cl.nom||cl.r} · ${cl.fr.toLowerCase()}</small></span>`:''}</div>${cl?`<p class="hint">Clé n°${cl.n} ${c.self?'— ce kanji est lui-même une clé':''}</p>`:''}`:''}
    <div class="tools"><button class="tb" id="furi">${S.opt.furi?'Masquer':'Afficher'} les lectures</button></div>

  </div></div>`;
  const sw=$('sw'), kb=$('kb'); let mode='view', eng=null, nums=false;

  $('anim').onclick=()=>{ mode='view'; kb.querySelectorAll('canvas').forEach(c=>c.remove()); const t=drawKanji(sw,k,{animate:true,numbers:nums}); $('hint').textContent='Ordre et sens des traits'; setTimeout(()=>{ if(mode==='view') $('hint').textContent=''; },t); };
  $('nums').onclick=()=>{ nums=!nums; $('nums').classList.toggle('on',nums); if(mode==='view') show(); };
  $('trace').onclick=()=>{ mode='trace'; $('trace').classList.add('on'); $('quizt').classList.remove('on'); kb.querySelectorAll('canvas').forEach(c=>c.remove()); $('hint').textContent='Trace le trait 1';
    eng=traceEngine(kb,k,err=>{ $('hint').innerHTML=(err?`Terminé avec ${err} erreur${err>1?'s':''}.`:'Sans faute.')+` <button class="tb" id="again">Refaire</button>`; $('again').onclick=()=>{eng.reset();$('hint').textContent='Trace le trait 1';}; if(!err) grade('k:'+k,2); },(i,n,err,msg)=>{ $('hint').textContent=msg?msg+' Trait '+(i+1)+' sur '+n+'.':`Trait ${i+1} sur ${n}`; }); };
  $('quizt').onclick=()=>{ mode='quiz'; $('quizt').classList.add('on'); $('trace').classList.remove('on'); kb.querySelectorAll('canvas').forEach(c=>c.remove());
    const n=(D.strokes[k]||[]).length, target=Math.floor(Math.random()*n); drawKanji(sw,k,{upto:0,ghost:true});

    const box=optsBox(list,idx=>miniKanji(k,idx),good=>{ drawKanji(sw,k,{upto:target+1,highlight:target,ghost:true}); grade('k:'+k,good?2:0); vib(good?12:[30,30,30]); later(()=>{ if(!$('hint')) return; $('hint').innerHTML=(good?'Exact.':`Le trait n°${target+1} est en rouge.`)+` <button class="tb" id="again">Un autre</button>`; $('again').onclick=()=>$('quizt').onclick(); },700); }); $('so').replaceWith(box); };

  x.vocab.forEach(v=>$('vl').appendChild(row(v)));
  if(related.length) related.slice(0,12).forEach(v=>{ const d=row(v); d.insertAdjacentHTML('beforeend',`<span class="unk">${v.seance}</span>`); $('rl').appendChild(d); }); }
function traceRun(list){ let i=0,total=list.length,errs=0; head('Tracer','dans l\'ordre des traits');
  const step=()=>{ if(i>=total){ $('view').innerHTML=`<div class="end"><div class="big jp">完</div><p>${total} kanji tracés · ${errs} erreur${errs>1?'s':''}</p><button class="btn" id="bk">Retour</button></div>`; $('bk').onclick=back; setBar(1); return; }

function decouvrir(id){ const d=D.kanji[id]; const blocs=d.blocs||[{nom:d.titre.split('— ')[1]||'',from:d.range[0],to:d.range[1]}]; let bi=0,ki=0;
  head('Découvrir',d.titre.replace('Séance ','S').split(' — ')[0]);
  const kanjiOf=b=>d.kanji.filter(k=>k.n>=b.from&&k.n<=b.to); const steps=()=>`<div class="step">${blocs.map((b,i)=>`<i class="${i<bi?'done':i===bi?'on':''}"></i>`).join('')}</div>`;
  function intro(){ const b=blocs[bi], ks=kanjiOf(b); info(`bloc <b>${bi+1}</b> / ${blocs.length}`,''); setBar(bi/blocs.length);
    $('view').innerHTML=`<div class="scroll">${steps()}<div class="blob"><div class="lab">${d.titre.split('— ')[0]}</div><h2>${b.nom}</h2><p>${ks.length} kanji · n°${b.from} à ${b.to}</p><div class="ks jp">${ks.map(k=>k.k).join('')}</div><p>${ks.reduce((a,k)=>a+k.vocab.length,0)} mots, dont ${ks.reduce((a,k)=>a+k.vocab.filter(v=>v.star===true).length,0)} ★</p></div><button class="btn" id="go">Commencer</button><button class="btn o" id="skip">Passer ce bloc</button></div>`;
    $('go').onclick=()=>{ ki=0; kanjiStep(); }; $('skip').onclick=()=>{ bi++; bi<blocs.length?intro():fin(); }; }
  function kanjiStep(){ const b=blocs[bi], ks=kanjiOf(b), k=ks[ki]; if(!k){ check(); return; }
    const c=(D.comp||{})[k.k]||{}, cl=cleOf(k.k); const stars=k.vocab.filter(v=>v.star===true), others=k.vocab.filter(v=>v.star!==true);
    info(`${b.nom} · <b>${ki+1}</b> / ${ks.length}`,`n°${k.n} · ${k.strokes} traits`); setBar((bi+ki/ks.length)/blocs.length);
    $('view').innerHTML=`<div class="scroll"><div class="fiche"><div class="kbox jp" id="kb"><div class="svgwrap" id="sw"></div></div><div class="kmeta"><div class="fr">${k.fr}</div></div>
      <div class="readings">${k.on.length?`<div class="rd"><b>ON</b><span class="jps">${k.on.join('・')}</span></div>`:''}${k.kun.length?`<div class="rd"><b>kun</b><span class="jps">${k.kun.join('・')}</span></div>`:''}</div>
      ${cl?`<div class="comp"><span class="cp jp rad">${c.rad||cl.c}<small>${cl.nom||cl.r} · ${cl.fr.toLowerCase()}</small></span>${(c.parts||[]).filter(p=>p!==c.rad).map(p=>`<span class="cp jp">${p}</span>`).join('')}</div>`:''}
      <div class="vlist">${stars.concat(others).slice(0,14).map(v=>`<div class="vi"><span class="w jp">${rubyW(markUnseen(v.w),v.r)}</span>${!S.opt.furi&&v.r?`<span class="r jps">${v.r}</span>`:''}<span class="f">${v.fr||''}</span>${v.star===true?'<span class="st">★</span>':''}${spk(sayable(v.r||v.w))}</div>`).join('')}</div></div></div>
      <div class="nav" style="display:flex;gap:9px;padding:8px 18px 14px"><button class="btn o" id="pv" style="flex:0 0 68px;margin:0">‹</button><button class="btn" id="nx" style="margin:0">${ki+1<ks.length?'Suivant':'Vérifier ce bloc'}</button></div>`;
    drawKanji($('sw'),k.k,{animate:true});
    $('nx').onclick=()=>{ grade('k:'+k.k,1); ki++; ki<ks.length?kanjiStep():check(); }; $('pv').onclick=()=>{ if(ki>0){ki--;kanjiStep();} else intro(); }; }
  function check(){ const b=blocs[bi], ks=kanjiOf(b); const items=[]; ks.forEach(k=>{ items.push({id:'k:'+k.k,type:'kanji',k,flow:'exam'}); k.vocab.filter(v=>v.star===true).slice(0,2).forEach(v=>items.push({id:'v:'+v.w+'/'+v.r,type:'vocab',v:{...v,seance:id,kanji:k.k},flow:'exam'})); });
    go(session,{items:pick(items,6),label:'Contrôle · '+b.nom,onEnd:()=>{ nav.pop(); bi++; bi<blocs.length?intro():fin(); }}); }
  function fin(){ setBar(1); info(''); const m=d.kanji.filter(k=>kanjiLevel(k.k)>=2).length;
    $('view').innerHTML=`<div class="end"><div class="big jp">了</div><p>${d.titre.split('— ')[1]} parcourue.<br>${d.kanji.length} kanji découverts · ${m} en cours d'acquisition</p><button class="btn" id="rev">Réviser cette séance</button><button class="btn o" id="bk">Terminer</button></div>`;

  intro(); }

function scopeItems(ids){ const S_=new Set(ids), it=[];

  VOCAB.forEach(v=>{ if(S_.has(v.seance)&&v.fr) it.push({id:v.id,type:'vocab',v}); });

  SENT.forEach(s=>{ if(S_.has(s.lecon)) it.push({id:s.id,type:'sent',s}); }); VERBS.forEach(v=>{ if(v.te&&S_.has(v.lecon)) it.push({id:v.id,type:'te',v}); }); ADJS.forEach(a=>{ if(a.opp.length&&S_.has(a.lecon)) it.push({id:a.id,type:'opp',a}); });
  return it; }
/* Quiz multi-angles : tirage item + angle, angles non répétés par item */
function quizMulti({ids}){ const items=scopeItems(ids); if(!items.length){ toast('Rien dans cette sélection'); return back(); }
  const used={}; let n=0,ok=0,streak=0,best=0,lock=false; const W=S.opt.games?.5:0; head('Quiz multi-angles',ids.join(' · '));
  const nextQ=()=>{ // pondération : faibles d'abord, angle le moins utilisé pour cet item
    const w=items.map(it=>{ const L=lvl(it.id); return {it,w:(L===0?3:L===1?4:L===2?2:1)*(used[it.id]&&used[it.id].last===n-1?.05:1)}; });
    let tot=w.reduce((a,b)=>a+b.w,0), r=Math.random()*tot, it=items[0]; for(const x of w){ r-=x.w; if(r<=0){it=x.it;break;} }
    const A=anglesFor(it); const u=used[it.id]=used[it.id]||{c:{},last:-1}; u.last=n;
    const angle=A.sort((a,b)=>(u.c[a]||0)-(u.c[b]||0)||Math.random()-.5)[0]; u.c[angle]=(u.c[angle]||0)+1;
    info(`<b>${ok}</b> / ${n} · série <b class="timer">${streak}</b>`,`record ${S.best['qm:'+ids.join(',')]||0}`); setBar(Math.min(1,n/30));
    renderItem(it,angle,(good,g)=>{ n++; if(good){ok++;streak++;} else streak=0; if(streak>best) best=streak; if(W) grade(it.id,g,W);
      if(streak>(S.best['qm:'+ids.join(',')]||0)){ S.best['qm:'+ids.join(',')]=streak; save(); } later(nextQ,good?520:950); }); };
  nextQ(); }

function duel({a,b}){ const IA=sh(scopeItems([a])), IB=sh(scopeItems([b])); let i=0,sa=0,sb=0; const total=20, W=S.opt.games?.5:0; head('Duel',a+' contre '+b);
  const next=()=>{ if(i>=total||!IA.length||!IB.length){ fin(); return; } const side=i%2===0?'A':'B'; const it=side==='A'?IA[Math.floor(i/2)%IA.length]:IB[Math.floor(i/2)%IB.length];

    const A=anglesFor(it); const angle=A[Math.random()*A.length|0];
    renderItem(it,angle,(good,g)=>{ if(good){ side==='A'?sa++:sb++; } if(W) grade(it.id,g,W); i++; later(next,good?520:950); }); };
  const fin=()=>{ setBar(1); info(''); const win=sa===sb?null:sa>sb?a:b;
    $('view').innerHTML=`<div class="end"><div class="duel"><div class="side"><b>${sa}</b><small>${a}</small></div><div class="vs">contre</div><div class="side"><b>${sb}</b><small>${b}</small></div></div>

function survival(id){ const d=D.kanji[id]; if(!d){ toast('Séance introuvable'); return back(); } const items=scopeItems([id]); let lives=3,n=0,lock=false; const W=S.opt.games?.5:0; head('Survie',d.titre.replace('Séance ','S').split(' — ')[0]);
  const tier=()=>n<8?0:n<18?1:n<30?2:3;
  const anglesTier=it=>{ const t=tier(), M=S.opt.modes; if(it.type==='kanji') return t===0?['ksens']:t===1?['ksens','count']:t===2?['stroke','kcle']:['stroke','kcle','count'];
    if(it.type==='vocab') return t===0?['reco']:t===1?['reco','rappel']:t===2?(TTS.ok?['rappel','listen']:['rappel']):(M.clavier||true)?(TTS.ok?['clavier','dictee','listenw']:['clavier']):['rappel'];
    if(it.type==='read') return t<2?['read']:t===2?['lecture2']:['clavier']; if(it.type==='cloze') return ['cloze']; return [it.type]; };
  const next=()=>{ if(lives<=0){ fin(); return; } const pool=items.filter(it=>it.type!=='sent'); const it=pool[Math.random()*pool.length|0]; const A=anglesTier(it); const angle=A[Math.random()*A.length|0];
    info(`<b>${n}</b> questions · palier ${tier()+1}`,`<span class="lives">${[0,1,2].map(i=>`<i class="${i<lives?'':'off'}"></i>`).join('')}</span>`); setBar(Math.min(1,n/40));
    renderItem(it,angle,(good,g)=>{ if(good) n++; else lives--; if(W) grade(it.id,g,W); later(next,good?450:950); },{mode:angle==='clavier'?'clavier':undefined}); };
  const fin=()=>{ const k='sv:'+id; const rec=n>(S.best[k]||0); if(rec){ S.best[k]=n; save(); } setBar(1); info('');
    $('view').innerHTML=`<div class="end"><div class="big">${n}</div><p>questions tenues avant la troisième erreur<br>${rec?'<b style="color:var(--seal)">Nouveau record.</b>':'Record : '+(S.best[k]||0)}</p><button class="btn" id="ag">Rejouer</button><button class="btn o" id="bk">Terminer</button></div>`;
    $('ag').onclick=()=>{ nav.pop(); go(survival,id); }; $('bk').onclick=home_; };
  next(); }
/* Exercices libres */
function libre(){ head('Exercices libres','rien n\'est enregistré');
  const T=[['reco','Japonais → français'],['rappel','Français → japonais'],['read','Quelle lecture'],['lecture2','Lecture → mot'],['cloze','Kanji manquant'],['clavier','Écrire la lecture'],['stroke','Ordre des traits'],['count','Nombre de traits'],['kcle','Clé d\'un kanji'],['sent','Construire la phrase'],['te','Forme en て'],['opp','Contraires']].concat(TTS.ok?[['listen','Écoute → sens'],['listenw','Écoute → écriture'],['dictee','Dictée']]:[]);
  let type='reco';
  const draw=()=>{ $('view').innerHTML=`<div class="scroll" style="padding-top:8px"><div class="sec" style="margin-top:0">Type d'exercice</div><div class="chips">${T.map(([k,l])=>`<button class="chip ${k===type?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><button class="btn" id="go" style="margin-top:18px">Choisir la portée</button></div>`;
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;draw();});
    $('go').onclick=()=>go(scopePick,{title:T.find(x=>x[0]===type)[1],then:sc=>{ const all=scopeItems(sc.ids);
      const map={reco:'vocab',rappel:'vocab',clavier:'vocab',listen:'vocab',listenw:'vocab',dictee:'vocab',read:'read',lecture2:'read',cloze:'cloze',stroke:'kanji',count:'kanji',kcle:'kanji',sent:'sent',te:'te',opp:'opp'};
      let its=all.filter(it=>it.type===map[type]); if(type==='kcle') its=its.filter(it=>cleOf(it.k.k)&&!(D.comp[it.k.k]||{}).self); if(type==='clavier'||type==='dictee') its=its.filter(it=>it.v&&it.v.r);
      if(!its.length){toast('Rien pour ce type dans cette sélection');return;} go(session,{items:sh(its).slice(0,40).map(it=>({...it,angle:type})),label:T.find(x=>x[0]===type)[1],free:true}); }}); }; draw(); }

/* ═══════ EXAMEN BLANC ═══════ */
function examSetup(){ head('Examen blanc','épreuve chronométrée'); const se=D.manifest.cours.kanji.seances.filter(x=>unlocked(x.id)), gs=D.manifest.cours.grammaire.lecons.filter(x=>x.id!=='L00'&&unlocked(x.id)); let sel=new Set(se.map(x=>x.id)), selg=new Set(gs.map(x=>x.id)), nq=30, dur=15;
  const draw=()=>{ $('view').innerHTML=`<div class="scroll" style="padding-top:8px"><p class="hint" style="text-align:left;padding:0 2px 8px">Lectures, sens, kanji manquants, ordre des traits, clés, forme en て, contraires, thème. Correction par type à la fin.</p>
    <div class="sec">Séances de kanji</div><div class="chips" id="ch"></div><div class="sec">Leçons de grammaire</div><div class="chips" id="cg"></div>
    <div class="sec">Questions</div><div class="chips" id="nq">${[15,30,50,80].map(n=>`<button class="chip ${n===nq?'on':''}" data-v="${n}">${n}</button>`).join('')}</div>
    <div class="sec">Durée</div><div class="chips" id="du">${[10,15,25,40].map(n=>`<button class="chip ${n===dur?'on':''}" data-v="${n}">${n} min</button>`).join('')}</div>
    <button class="btn s" id="go" style="margin-top:18px">Lancer l'épreuve</button></div>`;
    se.forEach(x=>{ const b=document.createElement('button'); b.className='chip'+(sel.has(x.id)?' on':''); b.textContent=x.id; b.onclick=()=>{ sel.has(x.id)?sel.delete(x.id):sel.add(x.id); draw(); }; $('ch').appendChild(b); });
    gs.forEach(x=>{ const b=document.createElement('button'); b.className='chip'+(selg.has(x.id)?' on':''); b.textContent=x.id; b.onclick=()=>{ selg.has(x.id)?selg.delete(x.id):selg.add(x.id); draw(); }; $('cg').appendChild(b); });
    $('nq').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{nq=+b.dataset.v;draw();}); $('du').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{dur=+b.dataset.v;draw();});
    $('go').onclick=()=>{ if(!sel.size&&!selg.size){toast('Choisis au moins une séance ou une leçon');return;} go(exam,{ids:[...sel,...selg],nq,dur}); }; }; draw(); }
function buildExam(ids,nq){ const all=scopeItems(ids); const by=t=>sh(all.filter(i=>i.type===t)); const Q=[];
  const add=(list,angle,frac,lab)=>list.slice(0,Math.ceil(nq*frac)).forEach(it=>Q.push({it,angle,lab}));
  add(by('read'),'read',.22,'Lecture'); add(by('vocab'),'reco',.15,'Sens'); add(by('cloze'),'cloze',.15,'Kanji manquant'); add(by('kanji'),'stroke',.12,'Ordre des traits');
  add(by('kanji').filter(i=>cleOf(i.k.k)&&!(D.comp[i.k.k]||{}).self),'kcle',.08,'Clé'); add(by('kanji'),'count',.04,'Nombre de traits');
  add(by('te'),'te',.08,'Forme en て'); add(by('opp'),'opp',.06,'Contraires'); add(by('sent'),'sent',.1,'Thème');
  return sh(Q).slice(0,nq); }
function exam({ids,nq,dur}){ const Q=buildExam(ids,nq); if(!Q.length){ toast('Pas assez de contenu'); return back(); } let i=0,ans=[],t0=Date.now(),end=t0+dur*60000,lock=false; head('Épreuve','ne ferme pas l\'appli');
  cur.stop=()=>clearInterval(cur.tick);
  cur.tick=setInterval(()=>{ const left=Math.max(0,end-Date.now()); $('subR').innerHTML=`<span class="timer${left<60000?' warn':''}">${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}</span>`; if(left<=0){ clearInterval(cur.tick); results(); } },250);
  const show=()=>{ if(i>=Q.length){ clearInterval(cur.tick); results(); return; } const q=Q[i]; lock=false; info(`<b>${i+1}</b> / ${Q.length} · ${q.lab}`,''); setBar(i/Q.length);
    renderItem(q.it,q.angle,(good,g)=>{ if(lock)return; lock=true; ans.push({q,good}); grade(q.it.id,g); i++; later(show,220); }); };
  const results=()=>{ const sec=Math.round((Date.now()-t0)/1000), ok=ans.filter(a=>a.good).length, n=ans.length||1; const byType={}; ans.forEach(a=>{ const t=byType[a.q.lab]=byType[a.q.lab]||{ok:0,n:0}; t.n++; if(a.good) t.ok++; }); const wrong=ans.filter(a=>!a.good); const note=Math.round(ok/n*200)/10;
    info(''); setBar(1); $('view').innerHTML=`<div class="scroll"><div class="end" style="padding-bottom:10px"><div class="big">${note}<span style="font-size:24px;color:var(--ink2)">/20</span></div><p>${ok} / ${n} · ${Math.floor(sec/60)} min ${sec%60}s${ans.length<Q.length?'<br>temps écoulé avant la fin':''}</p></div>
      <div class="sec">Par type de question</div><div id="rt"></div>${wrong.length?`<div class="sec">À revoir (${wrong.length})</div><div id="rw"></div>`:'<p class="hint">Sans faute.</p>'}
      <button class="btn" id="again" style="margin-top:16px">Nouvelle épreuve</button>${wrong.length?'<button class="btn o" id="rev">Réviser mes erreurs</button>':''}<button class="btn o" id="bk">Terminer</button></div>`;
    Object.entries(byType).forEach(([lab,v])=>{ const p=v.ok/v.n; const d=document.createElement('div'); d.className='res'; d.innerHTML=`<span class="lb">${lab}</span><span class="bar"><i style="width:${p*100}%;background:${p>=.8?'var(--ok)':p>=.5?'var(--gold)':'var(--ko)'}"></i></span><span class="pc">${v.ok}/${v.n}</span>`; $('rt').appendChild(d); });
    if(wrong.length) wrong.slice(0,40).forEach(a=>{ const it=a.q.it; const d=document.createElement('div'); d.className='wk'; const lab=it.k?it.k.k:it.v?it.v.w:it.r?it.r.w:it.c?it.c.w:it.a?it.a.w:'文'; const ans_=it.k?it.k.fr:it.v?it.v.fr+(it.v.r?' · '+it.v.r:''):it.r?it.r.r:it.c?it.c.k:it.a?it.a.opp.join(' / '):it.s?it.s.jp:'';
      d.innerHTML=`<span class="k jp">${lab}</span><span class="m">${a.q.lab}<small>${ans_}</small></span>`; $('rw').appendChild(d); });
    $('again').onclick=()=>{ nav.pop(); go(exam,{ids,nq,dur}); }; if($('rev')) $('rev').onclick=()=>go(session,{items:sh(wrong.map(a=>a.q.it)),label:'Mes erreurs'}); $('bk').onclick=home_; };
  show(); }
/* ═══════ MES AJOUTS ═══════ */
function perso(){ head('Mes ajouts','stockés sur ce téléphone');
  $('view').innerHTML=`<div class="scroll" style="padding-top:8px"><div class="field"><label>Mot (kanji ou kana)</label><input id="pw" class="jp" placeholder="図書館"></div><div class="field"><label>Lecture</label><input id="pr" class="jps" placeholder="としょかん"></div><div class="field"><label>Sens</label><input id="pf" placeholder="la bibliothèque"></div><button class="btn" id="add">Ajouter</button><div class="sec">Liste</div><div class="vlist" id="pl"></div></div>`;
  const draw=()=>{ const pl=$('pl'); pl.innerHTML=S.perso.length?'':'<p class="hint" style="text-align:left">Rien pour l\'instant. Ce que tu ajoutes ici entre dans le flux Enrichir.</p>';
    S.perso.forEach((p,i)=>{ const d=document.createElement('div'); d.className='vi'; d.innerHTML=`<span class="w jp">${esc(p.w)}</span><span class="r jps">${esc(p.r)}</span><span class="f">${esc(p.fr)}</span>${spk(p.r||p.w)}<button class="tb">✕</button>`; d.querySelector('.tb').onclick=()=>{ S.perso.splice(i,1); save(); index(); draw(); }; pl.appendChild(d); }); };
  $('add').onclick=()=>{ const w=$('pw').value.trim(),r=$('pr').value.trim(),fr=$('pf').value.trim(); if(!w||!fr){toast('Mot et sens obligatoires');return;} S.perso.push({w,r,fr}); save(); index(); $('pw').value=$('pr').value=$('pf').value=''; draw(); toast('Ajouté'); }; draw(); }

/* ═══════ À PROPOS ═══════ */
function about(){ head('À propos','');
  $('view').innerHTML=`<div class="scroll about" style="padding-top:8px">
  <p>Cette appli est faite par <b>Moussa M.</b> pour réviser les cours de kanji et de grammaire de L1 LEA japonais, à Lyon 3.</p>
  <p>Je l'ai d'abord construite pour moi. Comme elle m'aide, je la partage à qui veut s'en servir — gratuitement, sans rien en attendre.</p>
  <h3>Ce que c'est</h3><p>Un outil de révision basé sur les documents de nos cours. Le vocabulaire, les lectures et les listes viennent des séances de M. Couteau (kanji) et de Mme Noda (grammaire).</p>
  <h3>Ce que ce n'est pas</h3><p>Une source officielle. En cas de doute, <b>le cours fait foi</b>, pas l'appli. Des fautes de saisie sont possibles : si tu en repères une, écris-moi et je corrige.</p>
  <h3>Mises à jour</h3><p>J'ajoute le contenu au fil des séances. Les séances et leçons non encore vues en cours sont grisées, mais tu peux les débloquer toi-même pour prendre de l'avance.</p>
  <h3>Audio</h3><p>La prononciation utilise la voix japonaise de ton téléphone. C'est une synthèse, pas un locuteur natif : correcte sur les mots, plus mécanique sur les phrases, et elle ne rend pas l'accent de hauteur. Sur Android, installe le pack vocal japonais si le bouton n'apparaît pas.</p>
  <h3>Me contacter</h3><p>Discord <a>Mouss_</a> · Instagram <a href="https://instagram.com/Froshhhh" target="_blank">@Froshhhh</a></p>
  <h3>Crédits</h3><p>Ordre des traits et composants : <a href="http://kanjivg.tagaini.net" target="_blank">KanjiVG</a>, par Ulrich Apel, licence CC BY-SA 3.0.<br>Contenu pédagogique : cours de L1 LEA japonais, Université Jean Moulin Lyon 3.</p></div>`; }

/* ═══════ RÉGLAGES ═══════ */
function settings(){ head('Réglages',''); const M=S.opt.modes;
  const T=(id,lab,sub,on)=>`<button class="tog ${on?'on':''}" id="${id}"><div>${lab}<small>${sub}</small></div><div class="sw"></div></button>`;
  $('view').innerHTML=`<div class="scroll" style="padding-top:8px">
    ${T('ta','Audio','prononciation par la voix japonaise du téléphone'+(TTS.ok?'':' · aucune voix japonaise détectée'),S.opt.audio)}${T('tas','Prononcer automatiquement','chaque mot est lu quand il apparaît',S.opt.autoSpeak)}
    ${T('tf','Lectures affichées','furigana au-dessus des kanji dans les listes',S.opt.furi)}
    <div class="sec">Modes de révision</div>
    ${T('m1','Japonais → français','reconnaissance',M.reco)}${T('m2','Français → japonais','rappel',M.rappel)}${T('m3','Lectures','quelle lecture, lecture → mot',M.lecture)}${T('m5','Kanji manquant','texte à trous',M.trou)}${T('m4','Construction de phrase','grammaire',M.phrase)}${T('m7','Forme en て','verbes',M.te)}${T('m8','Contraires','adjectifs',M.contraire)}${T('m9','Clés','quelle est la clé de ce kanji',M.cle)}${T('m10','Écoute','compréhension orale, si audio disponible',M.ecoute)}${T('m6','Clavier','taper au lieu de choisir · plus dur',M.clavier)}
    <div class="sec">Nouveaux par jour</div><div class="tools" style="justify-content:flex-start">${[4,8,12,20].map(n=>`<button class="tb ${S.opt.newPerDay===n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
    <div class="sec">Données</div><button class="btn o" id="exp">Exporter ma progression</button><button class="btn o" id="imp">Importer</button><button class="btn o" id="rst" style="color:var(--ko)">Tout effacer</button></div>`;
  const tg=(id,fn)=>{ if($(id)) $(id).onclick=()=>{ fn(); save(); $(id).classList.toggle('on'); }; };
  tg('ta',()=>{S.opt.audio=!S.opt.audio; if(S.opt.audio) TTS.init();}); tg('tas',()=>S.opt.autoSpeak=!S.opt.autoSpeak); tg('tf',()=>S.opt.furi=!S.opt.furi);
  tg('m1',()=>M.reco=!M.reco); tg('m2',()=>M.rappel=!M.rappel); tg('m3',()=>M.lecture=!M.lecture); tg('m4',()=>M.phrase=!M.phrase); tg('m5',()=>M.trou=!M.trou); tg('m6',()=>M.clavier=!M.clavier); tg('m7',()=>M.te=!M.te); tg('m8',()=>M.contraire=!M.contraire); tg('m9',()=>M.cle=!M.cle); tg('m10',()=>M.ecoute=!M.ecoute);
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ S.opt.newPerDay=+b.dataset.n; save(); document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x===b)); });
  $('exp').onclick=()=>{ const t=JSON.stringify({srs:S.srs,opt:S.opt,perso:S.perso,log:S.log,unlocked:S.unlocked,best:S.best}); (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(()=>toast('Copié'),()=>prompt('Copie :',t)):prompt('Copie :',t)); };
  $('imp').onclick=()=>{ const t=prompt('Colle ta sauvegarde :'); if(!t)return; try{ const d=JSON.parse(t); S.srs=d.srs||{};S.opt=Object.assign(S.opt,d.opt||{});S.perso=d.perso||[];S.log=d.log||{};S.unlocked=d.unlocked||{};S.best=d.best||{}; save(); index(); toast('Restauré'); }catch(e){ toast('Texte invalide'); } };
  $('rst').onclick=()=>{ if(confirm('Effacer toute la progression ?')){ S.srs={};S.perso=[];S.log={};S.unlocked={};S.best={}; save(); index(); toast('Effacé'); } }; }
$('setBtn').onclick=()=>go(settings);
function applyTheme(){ document.documentElement.dataset.theme=S.opt.theme; document.querySelector('meta[name=theme-color]').content=S.opt.theme==='nuit'?'#171410':'#F6F1E7'; }
$('themeBtn').onclick=()=>{ S.opt.theme=S.opt.theme==='jour'?'nuit':'jour'; save(); applyTheme(); };

/* ═══════ BOOT ═══════ */
load(); applyTheme(); TTS.init();
loadData().then(()=>{ nav=[[home]]; render(); }).catch(e=>{ $('view').innerHTML=`<div class="loading">Impossible de charger les données.<br><small>${esc(e&&e.message||e)}</small><br><small>L'appli doit être ouverte depuis un serveur (GitHub Pages), pas en fichier local.</small></div>`; });
