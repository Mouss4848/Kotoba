<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F6F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="言葉">
<link rel="apple-touch-icon" href="icon.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=1">
<link rel="icon" type="image/png" href="icon.png?v=1">
<link rel="manifest" href="manifest.webmanifest">
<title>言葉 — Kanji &amp; grammaire</title>
<style>
:root{
  --paper:#F6F1E7;--paper2:#FFFCF5;--ink:#1F1B17;--ink2:#6B645B;--ink3:#A39B8E;--line:#E6DECF;--line2:#D3C9B6;
  --seal:#C8322B;--seal2:#E8635C;--gold:#B8892E;--ok:#2E7D5B;--ko:#B23A3A;--sel:#E9E1D2;
  --r:18px;--sh:0 1px 0 rgba(0,0,0,.02),0 8px 24px -18px rgba(60,40,20,.35);
}
html[data-theme="nuit"]{
  --paper:#171410;--paper2:#1F1B16;--ink:#EDE6D8;--ink2:#A69D8E;--ink3:#6E665B;--line:#2C2620;--line2:#3A332B;
  --seal:#D9453C;--seal2:#F0736B;--gold:#D2A44A;--ok:#5FBF93;--ko:#E06A6A;--sel:#2A241D;
  --sh:0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden;
  font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.jp{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","Noto Serif JP","MS Mincho",serif}
.jps{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* header */
.hd{display:flex;align-items:center;gap:8px;padding:12px 18px 6px;min-height:58px}
.hd h1{font-size:19px;font-weight:600;flex:1;letter-spacing:-.01em;line-height:1.15}
.hd h1 small{display:block;font-size:12.5px;color:var(--ink2);font-weight:400;margin-top:3px}
.ib{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--ink2);transition:background .15s}
.ib:active{background:var(--sel)}
.view{flex:1;min-height:0;display:flex;flex-direction:column;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 28px}

/* enso */
.enso{position:relative;width:132px;height:132px;margin:8px auto 4px}
.enso svg{width:100%;height:100%;transform:rotate(-90deg)}
.enso .c{fill:none;stroke:var(--line2);stroke-width:5}
.enso .p{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)}
.enso.full .p{stroke:var(--seal)}
.enso .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.enso .t b{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.enso .t small{font-size:11px;color:var(--ink2);margin-top:3px}
.hero{text-align:center;padding:6px 0 10px}
.hero .date{font-size:12.5px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.hero .pd{font-size:22px;margin-top:10px;line-height:1.5}
.hero .pdf{font-size:13px;color:var(--ink2);margin-top:2px}

/* buttons/cards */
.pri{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--r);background:var(--ink);color:var(--paper);box-shadow:var(--sh);transition:transform .12s;margin-bottom:10px}
.pri:active{transform:scale(.985)}
.pri .n{font-size:30px;font-weight:600;line-height:1;min-width:44px}
.pri .t{flex:1}
.pri .t b{display:block;font-size:15.5px;font-weight:600}
.pri .t small{opacity:.7;font-size:12.5px}
.pri.alt{background:var(--paper2);color:var(--ink);border:1px solid var(--line)}
.pri.alt .t small{color:var(--ink2);opacity:1}
.row{display:flex;gap:10px;margin-bottom:10px}
.row .pri{margin:0}
.sec{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:22px 2px 10px}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-radius:var(--r);background:var(--paper2);border:1px solid var(--line);margin-bottom:9px;transition:transform .12s,border-color .15s;position:relative}
.card:active{transform:scale(.985)}
.card .g{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--sel)}
.card .b{flex:1;min-width:0}
.card .b b{display:block;font-size:15px;font-weight:600}
.card .b small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px;line-height:1.35}
.card .arrow{color:var(--ink3);font-size:18px}
.card.dim{opacity:.55}
.mini-enso{width:34px;height:34px;flex:none}
.mini-enso svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini-enso .c{fill:none;stroke:var(--line2);stroke-width:4}
.mini-enso .p{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.mini-enso.full .p{stroke:var(--seal)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;letter-spacing:.04em;border:1px solid var(--line2);color:var(--ink2);margin-left:6px;vertical-align:middle}
.tag.seal{border-color:var(--seal);color:var(--seal)}
.tag.gold{border-color:var(--gold);color:var(--gold)}

/* kanji grid */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kc{aspect-ratio:1;border-radius:16px;background:var(--paper2);border:1px solid var(--line);display:grid;place-items:center;font-size:36px;position:relative;transition:transform .12s}
.kc:active{transform:scale(.94)}
.kc small{position:absolute;bottom:5px;right:8px;font-size:9.5px;color:var(--ink3);font-family:-apple-system,system-ui}
.kc em{position:absolute;top:5px;left:8px;font-size:9.5px;color:var(--ink3);font-style:normal;font-family:-apple-system,system-ui}
.kc.l1{border-color:var(--ko)}.kc.l1 small{color:var(--ko)}
.kc.l2{border-color:var(--gold)}.kc.l2 small{color:var(--gold)}
.kc.l3{border-color:var(--ok)}.kc.l3 small{color:var(--ok)}
.kc.l4{border-color:var(--seal);background:var(--sel)}.kc.l4 small{color:var(--seal)}
.kc.l4::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--seal)}
.kc.future{opacity:.4}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11.5px;color:var(--ink2);padding:12px 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle;border:1px solid var(--line2)}

/* kanji fiche */
.fiche{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.kbox{width:min(62vw,240px);aspect-ratio:1;border-radius:26px;background:var(--paper2);border:1px solid var(--line);position:relative;box-shadow:var(--sh)}
.kbox svg{width:100%;height:100%;display:block}
.kbox .gl{fill:none;stroke:var(--line2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.kbox .st{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.kbox .st.hi{stroke:var(--seal)}
.kbox .st.ok{stroke:var(--ok)}
.kbox .num{font-size:7px;fill:var(--seal);font-family:-apple-system,system-ui;font-weight:700}
.kbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:26px}
.kbox .grid-l{stroke:var(--line);stroke-width:.6;stroke-dasharray:3 3}
.kmeta{text-align:center;margin-top:12px}
.kmeta .fr{font-size:20px;font-weight:600;letter-spacing:-.01em}
.kmeta .n{font-size:12px;color:var(--ink3);margin-top:2px;letter-spacing:.06em}
.readings{display:flex;gap:10px;justify-content:center;margin:14px 0 6px;flex-wrap:wrap}
.rd{padding:8px 14px;border-radius:12px;background:var(--paper2);border:1px solid var(--line);font-size:15px}
.rd b{font-size:10px;letter-spacing:.1em;color:var(--ink3);display:block;margin-bottom:2px;font-weight:600}
.tools{display:flex;gap:8px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.tb{padding:9px 14px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;color:var(--ink);background:var(--paper2)}
.tb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vlist{width:100%;margin-top:6px}
.vi{display:flex;align-items:baseline;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.vi .w{font-size:20px;min-width:96px;line-height:1.4}
.vi .w rt{font-size:9px;color:var(--ink2)}
.vi .r{font-size:12px;color:var(--ink2)}
.vi .f{flex:1;font-size:14px;color:var(--ink);line-height:1.35}
.vi .f.empty{color:var(--ink3);font-style:italic}
.vi .st{color:var(--seal);font-size:14px}
.vi .unk{color:var(--ink3);font-size:11px}
.notseen{color:var(--seal2);text-decoration:underline dotted;text-underline-offset:3px}
.hint{color:var(--ink2);font-size:13px;text-align:center;margin-top:10px;line-height:1.45;padding:0 12px;min-height:18px}

/* review */
.rv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 18px}
.rcard{width:100%;max-width:400px;min-height:230px;border-radius:24px;background:var(--paper2);border:1px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 20px;position:relative;text-align:center;transition:transform .12s}
.rcard.ko{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
.rcard .kind{position:absolute;top:12px;left:0;right:0;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.rcard .big{font-size:clamp(64px,22vw,96px);line-height:1.1}
.rcard .mid{font-size:34px;line-height:1.3}
.rcard .fr{font-size:22px;font-weight:600;line-height:1.3}
.rcard .sub{color:var(--ink2);font-size:15px;margin-top:8px;line-height:1.45}
.rcard .ans{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2);width:100%}
.seal{position:absolute;right:14px;bottom:12px;width:52px;height:52px;border-radius:50%;border:3px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-size:20px;font-weight:700;transform:scale(0) rotate(-12deg);opacity:0;pointer-events:none}
.seal.on{animation:stamp .45s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{0%{transform:scale(1.6) rotate(-12deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:.95}}
.ink{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:var(--ko);opacity:0;transform:translate(-50%,-50%) scale(0);pointer-events:none;filter:blur(6px)}
.ink.on{animation:blot .7s ease-out forwards}
@keyframes blot{0%{transform:translate(-50%,-50%) scale(0);opacity:.55}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px;margin-top:14px}
.opt{padding:16px 10px;border-radius:16px;background:var(--paper2);border:1px solid var(--line);font-size:15px;text-align:center;line-height:1.3;transition:transform .1s,background .12s}
.opt.jp{font-size:22px}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}
.opt.dim{opacity:.35}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:400px;margin-top:14px}
.grade button{padding:15px 6px;border-radius:16px;border:1px solid var(--line);background:var(--paper2);font-size:14px;font-weight:600;text-align:center}
.grade .g0{color:var(--ko)}.grade .g1{color:var(--gold)}.grade .g2{color:var(--ok)}
.reveal{width:100%;max-width:400px;margin-top:14px;padding:16px;border-radius:16px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;text-align:center}
.builder{width:100%;max-width:400px;margin-top:14px}
.slot{min-height:64px;border-radius:16px;border:1.5px dashed var(--line2);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper2)}
.slot.ok{border-color:var(--ok)}.slot.ko{border-color:var(--ko)}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.tk{padding:10px 14px;border-radius:12px;background:var(--paper2);border:1px solid var(--line2);font-size:19px;transition:transform .1s;line-height:1.2}
.tk:active{transform:scale(.95)}
.tk.used{opacity:.25;pointer-events:none}
.slot .tk{background:var(--sel)}
.prog{height:3px;background:var(--line);margin:0 18px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .35s}
.sub{display:flex;justify-content:space-between;padding:8px 20px;font-size:12.5px;color:var(--ink2)}
.sub b{color:var(--ink);font-weight:600}
.end{text-align:center;padding:30px 20px}
.end .big{font-size:56px;font-weight:600}
.end p{color:var(--ink2);margin:10px 0 22px;line-height:1.55}

/* lesson */
.pt{padding:16px;border-radius:var(--r);background:var(--paper2);border:1px solid var(--line);margin-bottom:12px}
.pt h3{font-size:16px;font-weight:600;margin-bottom:6px}
.pt .why{color:var(--ink2);font-size:13.5px;line-height:1.5;margin-bottom:10px}
.ex{padding:9px 0;border-top:1px dashed var(--line)}
.ex .j{font-size:19px;line-height:1.55}
.ex .f{font-size:13px;color:var(--ink2);margin-top:2px}

/* forms & settings */
.field{margin-bottom:10px}
.field label{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.field input,.field textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--paper2);font-size:16px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--ink);color:var(--paper);font-size:15.5px;font-weight:600;text-align:center;margin-top:8px}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.s{background:var(--seal);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:14px;background:var(--paper2);border:1px solid var(--line);margin-bottom:8px;width:100%;font-size:15px}
.tog small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.sw{width:44px;height:26px;flex:none;border-radius:13px;background:var(--line2);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on .sw{background:var(--seal)}.tog.on .sw::after{left:21px}
.about p{font-size:15px;line-height:1.6;margin-bottom:12px;color:var(--ink)}
.about h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:20px 0 6px}
.about a{color:var(--seal);text-decoration:none;font-weight:600}
.toast{position:fixed;left:18px;right:18px;top:calc(10px + env(safe-area-inset-top));background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;z-index:30;transform:translateY(-140%);transition:transform .32s cubic-bezier(.2,.9,.3,1);text-align:center;font-size:14px}
.toast.on{transform:none}
.loading{flex:1;display:grid;place-items:center;color:var(--ink2);font-size:14px}
.cal{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}
.cal i{width:12px;height:12px;border-radius:4px;border:1px solid var(--line2)}
.cal i.on{background:var(--seal);border-color:var(--seal)}

/* v2 */
.bloc{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.bloc h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.bloc span{flex:1;height:1px;background:var(--line)}
.bloc b{font-size:12px;color:var(--ink3);font-weight:500}
.step{display:flex;gap:5px;justify-content:center;margin:2px 0 8px}
.step i{width:22px;height:3px;border-radius:2px;background:var(--line2)}
.step i.on{background:var(--ink)}
.step i.done{background:var(--seal)}
.blob{text-align:center;padding:26px 16px}
.blob .lab{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.blob h2{font-size:26px;font-weight:600;margin:8px 0 6px;letter-spacing:-.02em}
.blob p{color:var(--ink2);font-size:14px;line-height:1.5}
.blob .ks{font-size:30px;letter-spacing:.14em;margin:16px 0 4px;line-height:1.5}
.comp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.comp .cp{padding:8px 12px;border-radius:12px;background:var(--paper2);border:1px solid var(--line);font-size:22px;line-height:1.2;text-align:center}
.comp .cp small{display:block;font-size:10px;color:var(--ink3);font-family:-apple-system,system-ui;margin-top:2px}
.comp .cp.rad{border-color:var(--seal);color:var(--seal)}
.cloze{font-size:34px;letter-spacing:.06em;line-height:1.5}
.cloze .hole{display:inline-block;min-width:44px;border-bottom:3px solid var(--seal);color:var(--seal)}
.kbd{width:100%;max-width:400px;margin-top:14px}
.kbd input{width:100%;padding:16px;border-radius:16px;border:1.5px solid var(--line2);background:var(--paper2);font-size:22px;text-align:center}
.kbd input.ok{border-color:var(--ok)}.kbd input.ko{border-color:var(--ko)}
.exam{padding:2px 0}
.exam .q{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:center;margin-bottom:4px}
.res{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.res .bar{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.res .bar i{display:block;height:100%;border-radius:4px}
.res .lb{font-size:13.5px;min-width:120px}
.res .pc{font-size:13px;color:var(--ink2);min-width:52px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line2);font-size:13px;background:var(--paper2)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.warn{color:var(--ko)}
.wk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wk .k{font-size:26px;min-width:40px}
.wk .m{flex:1;font-size:13.5px}
.wk .m small{display:block;color:var(--ink2);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div class="hd">
    <button class="ib hidden" id="back">‹</button>
    <h1 id="title">言葉</h1>
    <button class="ib" id="themeBtn" aria-label="Thème">◐</button>
    <button class="ib" id="setBtn" aria-label="Réglages">⚙︎</button>
  </div>
  <div class="prog"><i id="bar"></i></div>
  <div class="sub"><span id="subL"></span><span id="subR"></span></div>
  <div class="view" id="view"><div class="loading">Chargement…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ═══════ ÉTAT & STOCKAGE ═══════ */
const $=id=>document.getElementById(id);
const KEY='kotoba-v1';
let D={manifest:null,kanji:{},gram:{},strokes:{},comp:{},cloze:[],read:[]};
let S={srs:{},opt:{theme:'jour',furi:false,newPerDay:8,modes:{reco:true,rappel:true,lecture:true,phrase:true,trou:true,clavier:false}},perso:[],log:{},about:false};
let nav=[],cur={};
function load(){ try{ const v=localStorage.getItem(KEY); if(v){ const d=JSON.parse(v); S.srs=d.srs||{}; S.opt=Object.assign(S.opt,d.opt||{}); S.perso=d.perso||[]; S.log=d.log||{}; } }catch(e){} }
let sT; function save(){ clearTimeout(sT); sT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify({srs:S.srs,opt:S.opt,perso:S.perso,log:S.log})); }catch(e){} },200); }
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DAY=864e5;
function toast(t){ $('toast').textContent=t; $('toast').classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>$('toast').classList.remove('on'),2600); }
function vib(p){ try{navigator.vibrate&&navigator.vibrate(p)}catch(e){} }
function fdate(s){ const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }

/* ═══════ DONNÉES ═══════ */
async function loadData(){
  const m=await (await fetch('data/manifest.json',{cache:'no-store'})).json(); D.manifest=m;
  const jobs=[];
  m.cours.kanji.seances.forEach(s=>jobs.push(fetch('data/kanji/'+s.id+'.json').then(r=>r.json()).then(j=>D.kanji[s.id]=j).catch(()=>{})));
  m.cours.grammaire.lecons.forEach(l=>jobs.push(fetch('data/grammaire/'+l.id+'.json').then(r=>r.json()).then(j=>D.gram[l.id]=j).catch(()=>{})));
  jobs.push(fetch('data/strokes.json').then(r=>r.json()).then(j=>D.strokes=j).catch(()=>{}));
  jobs.push(fetch('data/components.json').then(r=>r.json()).then(j=>D.comp=j).catch(()=>{D.comp={}}));
  jobs.push(fetch('data/cloze.json').then(r=>r.json()).then(j=>D.cloze=j).catch(()=>{D.cloze=[]}));
  jobs.push(fetch('data/readings.json').then(r=>r.json()).then(j=>D.read=j).catch(()=>{D.read=[]}));
  await Promise.all(jobs);
  index();
}
let KANJI=[],VOCAB=[],SENT=[],BYK={};
function index(){
  KANJI=[];VOCAB=[];SENT=[];BYK={};
  Object.values(D.kanji).sort((a,b)=>a.range[0]-b.range[0]).forEach(s=>{
    s.kanji.forEach(k=>{ k.seance=s.id; k.date=s.date; KANJI.push(k); BYK[k.k]=k;
      k.vocab.forEach(v=>VOCAB.push({...v,kanji:k.k,seance:s.id,id:'v:'+v.w+'/'+v.r,src:'kanji'})); });
  });
  Object.values(D.gram).forEach(g=>{
    (g.vocab||[]).forEach(([w,fr])=>VOCAB.push({w,r:'',fr,star:true,seance:g.id,id:'v:'+w+'/'+g.id,src:'gram'}));
    g.points.forEach((p,pi)=>p.ex.forEach((e,ei)=>{ if(e.tok&&e.tok.length>1) SENT.push({...e,id:'s:'+g.id+':'+pi+':'+ei,lecon:g.id,point:p.t}); }));
  });
  S.perso.forEach(p=>VOCAB.push({w:p.w,r:p.r,fr:p.fr,star:false,seance:'perso',id:'v:perso:'+p.w,src:'perso'}));
  CLOZE=(D.cloze||[]).filter(c=>D.kanji[c.seance]); READS=(D.read||[]).filter(r=>D.kanji[r.seance]);
}
let CLOZE=[],READS=[];
const kanjiSeen=k=>{const x=BYK[k];return x?x.date<=today():true;};

/* ═══════ SRS ═══════ */
function st(id){ return S.srs[id]||null; }
function isDue(id){ const s=st(id); return s&&s.due<=Date.now(); }
function grade(id,g){ // 0 raté 1 dur 2 facile
  let s=S.srs[id]||{iv:0,ease:2.3,reps:0,lapses:0};
  if(g===0){ s.iv=0; s.lapses++; s.ease=Math.max(1.3,s.ease-.2); s.due=Date.now()+10*60e3; }
  else if(g===1){ s.iv=Math.max(1,Math.round(s.iv*1.2)||1); s.ease=Math.max(1.3,s.ease-.12); s.due=Date.now()+s.iv*DAY; }
  else { s.iv=s.iv===0?1:s.iv===1?3:Math.round(s.iv*s.ease); s.ease=Math.min(2.8,s.ease+.05); s.due=Date.now()+s.iv*DAY; }
  s.reps++; s.last=Date.now(); S.srs[id]=s;
  const t=today(); S.log[t]=(S.log[t]||0)+1; save();
}
function lvl(id){ const s=st(id); if(!s) return 0; if(s.iv<3) return 1; if(s.iv<10) return 2; if(s.iv<30) return 3; return 4; }
function kanjiLevel(k){ return lvl('k:'+k); }
function flowOf(v){ return v.star===false?'enrich':'exam'; } // null (inconnu) → exam
function poolItems(){
  const items=[];
  KANJI.forEach(k=>{ if(kanjiSeen(k.k)) items.push({id:'k:'+k.k,type:'kanji',k,flow:'exam'}); });
  VOCAB.forEach(v=>{ if(v.seance==='perso'||!D.kanji[v.seance]||D.kanji[v.seance].date<=today()||D.gram[v.seance]) items.push({id:v.id,type:'vocab',v,flow:flowOf(v)}); });
  SENT.forEach(s=>items.push({id:s.id,type:'sent',s,flow:'exam'}));
  if(S.opt.modes.trou) CLOZE.forEach(c=>{ if(D.kanji[c.seance].date<=today()) items.push({id:c.id,type:'cloze',c,flow:c.star===false?'enrich':'exam'}); });
  if(S.opt.modes.lecture) READS.forEach(r=>{ if(D.kanji[r.seance].date<=today()) items.push({id:r.id,type:'read',r,flow:r.star===false?'enrich':'exam'}); });
  return items;
}
function dueLists(){
  const all=poolItems(); const due=all.filter(i=>isDue(i.id)); const fresh=all.filter(i=>!st(i.id));
  return {all,due,fresh,dueExam:due.filter(i=>i.flow==='exam'),dueEnrich:due.filter(i=>i.flow==='enrich'),freshExam:fresh.filter(i=>i.flow==='exam'),freshEnrich:fresh.filter(i=>i.flow==='enrich')};
}

/* ═══════ NAVIGATION ═══════ */
function go(fn,arg){ nav.push([fn,arg]); render(); }
function back(){ if(nav.length>1) nav.pop(); render(); }
function render(){ cur.stop&&cur.stop(); cur={}; const [fn,arg]=nav[nav.length-1]; $('view').innerHTML=''; $('back').classList.toggle('hidden',nav.length<=1); setBar(0); info('',''); fn(arg); }
$('back').onclick=back;
function head(t,s){ $('title').innerHTML=t+(s?'<small>'+s+'</small>':''); }
function info(l,r){ $('subL').innerHTML=l; $('subR').innerHTML=r; }
function setBar(p){ $('bar').style.width=(Math.max(0,Math.min(1,p))*100)+'%'; }
function ensoSVG(p,size){ const r=44,c=2*Math.PI*r; return `<svg viewBox="0 0 100 100"><circle class="c" cx="50" cy="50" r="${r}"/><circle class="p" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`; }

function pickNew(list,n){ // ordre : kanji d'abord (par n), puis vocab ★ des séances les plus anciennes
  const k=list.filter(i=>i.type==='kanji').sort((a,b)=>a.k.n-b.k.n), v=list.filter(i=>i.type==='vocab'), s=list.filter(i=>i.type==='sent');
  const out=[]; let i=0; while(out.length<n&&(k[i]||v[i]||s[i])){ if(k[i]) out.push(k[i]); if(v[i]&&out.length<n) out.push(v[i]); if(s[i]&&out.length<n&&i%2===0) out.push(s[i]); i++; } return out;
}

/* ═══════ TRACÉ (moteur) ═══════ */
function parsePath(d){ // retourne [[x,y]...] points approximatifs (début, fin et points de contrôle) + début/fin exacts
  const toks=d.match(/[MmCcLlSsHhVvZz]|-?\d*\.?\d+(?:e-?\d+)?/g); let i=0,x=0,y=0,cmd='',pts=[],start=null;
  const num=()=>parseFloat(toks[i++]);
  while(i<toks.length){ const t=toks[i]; if(/[A-Za-z]/.test(t)){cmd=t;i++;}
    if(cmd==='M'){x=num();y=num();cmd='L';} else if(cmd==='m'){x+=num();y+=num();cmd='l';}
    else if(cmd==='C'){num();num();num();num();x=num();y=num();} else if(cmd==='c'){num();num();num();num();x+=num();y+=num();}
    else if(cmd==='S'){num();num();x=num();y=num();} else if(cmd==='s'){num();num();x+=num();y+=num();}
    else if(cmd==='L'){x=num();y=num();} else if(cmd==='l'){x+=num();y+=num();}
    else if(cmd==='H'){x=num();} else if(cmd==='h'){x+=num();} else if(cmd==='V'){y=num();} else if(cmd==='v'){y+=num();}
    else if(cmd==='Z'||cmd==='z'){i++;continue;} else {i++;continue;}
    if(!start) start=[x,y]; pts.push([x,y]); }
  return {start,end:pts[pts.length-1],pts};
}
function drawKanji(box,k,opts={}){ // opts: {animate, upto, highlight, numbers, ghost}
  const paths=D.strokes[k]||[], n=opts.upto==null?paths.length:opts.upto;
  let svg=`<svg viewBox="0 0 109 109"><line class="grid-l" x1="54.5" y1="4" x2="54.5" y2="105"/><line class="grid-l" x1="4" y1="54.5" x2="105" y2="54.5"/>`;
  if(opts.ghost!==false) paths.forEach(d=>svg+=`<path class="gl" d="${d}"/>`);
  paths.slice(0,n).forEach((d,i)=>svg+=`<path class="st${opts.highlight===i?' hi':''}${opts.done&&opts.done.has(i)?' ok':''}" d="${d}" ${opts.animate?'data-anim="1"':''}/>`);
  if(opts.numbers) paths.forEach((d,i)=>{ const p=parsePath(d).start; svg+=`<text class="num" x="${Math.min(100,p[0]+2)}" y="${Math.max(9,p[1]-2)}">${i+1}</text>`; });
  svg+='</svg>'; box.innerHTML=svg;
  if(opts.animate){ const els=[...box.querySelectorAll('path.st')]; let t=0;
    els.forEach((el,i)=>{ const L=el.getTotalLength(); el.style.strokeDasharray=L; el.style.strokeDashoffset=L; el.style.transition='none';
      setTimeout(()=>{ el.style.transition=`stroke-dashoffset ${Math.max(.25,L/140)}s ease-out`; el.style.strokeDashoffset=0; },t); t+=Math.max(250,L/140*1000)+120; });
    return t; }
  return 0;
}
function traceEngine(box,k,onDone,onProgress){
  const paths=D.strokes[k]||[]; let i=0,drawing=false,pts=[],err=0;
  const cv=document.createElement('canvas'); box.appendChild(cv); const c=cv.getContext('2d');
  const fit=()=>{ const r=cv.getBoundingClientRect(),dp=devicePixelRatio||1; cv.width=r.width*dp;cv.height=r.height*dp; c.setTransform(dp,0,0,dp,0,0); c.lineWidth=Math.max(6,r.width/26); c.lineCap='round';c.lineJoin='round'; c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000'; };
  setTimeout(fit,20);
  const toUnit=p=>{ const r=cv.getBoundingClientRect(); return [p[0]/r.width*109,p[1]/r.height*109]; };
  const pos=e=>{ const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e; return [t.clientX-r.left,t.clientY-r.top]; };
  const redraw=()=>drawKanji(box.querySelector('.svgwrap')||box,k,{upto:i,done:new Set([...Array(i).keys()]),ghost:true});
  const start=e=>{ if(i>=paths.length)return; e.preventDefault(); drawing=true; pts=[pos(e)]; c.beginPath(); c.moveTo(...pts[0]); };
  const move=e=>{ if(!drawing)return; e.preventDefault(); const p=pos(e); pts.push(p); c.lineTo(...p); c.stroke(); };
  const end=()=>{ if(!drawing)return; drawing=false; c.clearRect(0,0,cv.width,cv.height);
    if(pts.length<2) return;
    const exp=parsePath(paths[i]); const a=toUnit(pts[0]),b=toUnit(pts[pts.length-1]);
    const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
    let len=0; for(let j=1;j<pts.length;j++) len+=dist(toUnit(pts[j-1]),toUnit(pts[j]));
    let elen=0; for(let j=1;j<exp.pts.length;j++) elen+=dist(exp.pts[j-1],exp.pts[j]);

    if(okStart&&okEnd&&okLen){ i++; vib(12); redraw(); onProgress&&onProgress(i,paths.length,err); if(i>=paths.length){ onDone&&onDone(err); } }

      stamp(document.querySelector('.rcard'),good); done(it,good?(first?2:2):0); }; b.dataset.id=o.id; box.appendChild(b); }); }
  function cardSent(it){ const s=it.s; const toks=sh(s.tok.map((t,j)=>({t,j}))); let placed=[];
    $('view').innerHTML=`<div class="rv"><div class="rcard" style="min-height:120px"><div class="kind">construire la phrase · ${s.point}</div><div class="fr">${s.fr}</div></div>

    const slot=$('slot'),tk=$('tk');
    const redraw=()=>{ slot.innerHTML=placed.map(p=>`<span class="tk jp">${p.t}</span>`).join(''); [...tk.children].forEach(b=>b.classList.toggle('used',placed.some(p=>p.j===+b.dataset.j))); };
    toks.forEach(o=>{ const b=document.createElement('button'); b.className='tk jp'; b.textContent=o.t; b.dataset.j=o.j; b.onclick=()=>{ if(b.classList.contains('used'))return; placed.push(o); redraw(); if(placed.length===s.tok.length) check(); }; tk.appendChild(b); });
    $('undo').onclick=()=>{ placed.pop(); redraw(); slot.className='slot'; };
    const check=()=>{ const good=placed.length===s.tok.length&&placed.every((p,j)=>p.j===j); slot.className='slot '+(good?'ok':'ko'); stamp(document.querySelector('.rcard'),good);
      if(!good){ setTimeout(()=>{ slot.innerHTML=s.tok.map(t=>`<span class="tk jp">${t}</span>`).join(''); slot.className='slot ok'; },600); }
      done(it,good?2:0); };
    $('check').onclick=check; $('showb').onclick=()=>{ slot.innerHTML=s.tok.map(t=>`<span class="tk jp">${t}</span>`).join(''); slot.className='slot ok'; stamp(document.querySelector('.rcard'),false); done(it,0); }; }
  function cardCloze(it){ const c=it.c; const masked=[...c.w].map((ch,j)=>j===c.i?'<span class="hole">?</span>':ch).join('');
    const opts=sh([c.k,...c.d.slice(0,3)]);
    $('view').innerHTML=`<div class="rv"><div class="rcard"><div class="kind">quel kanji manque ?${c.star===true?' ★':''}</div>
      <div class="cloze jp">${masked}</div><div class="sub">${c.fr}</div>${S.opt.furi?`<div class="sub jps">${c.r}</div>`:''}</div>
      <div class="opts" id="opts"></div></div>`;
    const box=$('opts'); opts.forEach(o=>{ const b=document.createElement('button'); b.className='opt jp'; b.textContent=o; b.dataset.k=o;
      b.onclick=()=>{ const good=o===c.k; [...box.children].forEach(x=>{ if(x.dataset.k===c.k) x.classList.add('ok'); else x.classList.add('dim'); }); if(!good) b.classList.add('ko');
        document.querySelector('.cloze').innerHTML=[...c.w].map((ch,j)=>j===c.i?`<span class="hole">${c.k}</span>`:ch).join('');
        stamp(document.querySelector('.rcard'),good); done(it,good?2:0); }; box.appendChild(b); }); }

  function cardRead(it){ const r=it.r, kb=S.opt.modes.clavier&&st(it.id)&&Math.random()<.45;
    if(kb){ $('view').innerHTML=`<div class="rv"><div class="rcard"><div class="kind">écris la lecture${r.star===true?' ★':''}</div><div class="mid jp">${r.w}</div><div class="sub">${r.fr}</div></div>
      <div class="kbd"><input id="in" class="jps" placeholder="ひらがな" autocomplete="off" autocapitalize="off" spellcheck="false"></div><div class="grade" style="grid-template-columns:1fr"><button id="val">Valider</button></div></div>`;
      const inp=$('in'); inp.focus();
      const val=()=>{ const v=inp.value.trim(); const good=v===r.r; inp.className='jps '+(good?'ok':'ko');
        if(!good) inp.value=r.r; stamp(document.querySelector('.rcard'),good); done(it,good?2:0); };
      $('val').onclick=val; inp.onkeydown=e=>{ if(e.key==='Enter') val(); }; return; }
    const opts=sh([r.r,...r.d.slice(0,3)]);
    $('view').innerHTML=`<div class="rv"><div class="rcard"><div class="kind">quelle lecture ?${r.star===true?' ★':''}</div><div class="mid jp">${r.w}</div><div class="sub">${r.fr}</div></div><div class="opts" id="opts"></div></div>`;
    const box=$('opts'); opts.forEach(o=>{ const b=document.createElement('button'); b.className='opt jps'; b.style.fontSize='19px'; b.textContent=o; b.dataset.r=o;
      b.onclick=()=>{ const good=o===r.r; [...box.children].forEach(x=>{ if(x.dataset.r===r.r) x.classList.add('ok'); else x.classList.add('dim'); }); if(!good) b.classList.add('ko');
        stamp(document.querySelector('.rcard'),good); done(it,good?2:0); }; box.appendChild(b); }); }

  const fin=()=>{ setBar(1); info('',''); $('view').innerHTML=`<div class="end"><div class="big jp">${ko===0?'完':'了'}</div><p>${total} carte${total>1?'s':''} · ${ok} réussie${ok>1?'s':''} · ${ko} à revoir<br>${ko===0?'Sans faute.':'Les ratés reviennent dans dix minutes.'}</p><button class="btn" id="bk">Terminer</button></div>`; $('bk').onclick=()=>{ if(onEnd) onEnd(); else { nav=[[home]]; render(); } }; };
  next();
}

/* ═══════ EXAMEN BLANC ═══════ */
function examSetup(){
  head('Examen blanc','épreuve chronométrée');
  const se=D.manifest.cours.kanji.seances.filter(x=>D.kanji[x.id]&&D.kanji[x.id].date<=today());
  let sel=new Set(se.map(x=>x.id)), nq=30, dur=15;
  const draw=()=>{ $('view').innerHTML=`<div class="scroll" style="padding-top:8px">
    <p class="hint" style="text-align:left;padding:0 2px 8px">Épreuve mélangeant lectures, sens, kanji manquants, ordre des traits et thème. Correction détaillée par type de question à la fin.</p>
    <div class="sec">Séances</div><div class="chips" id="ch"></div>
    <div class="sec">Nombre de questions</div><div class="chips" id="nq">${[15,30,50,80].map(n=>`<button class="chip ${n===nq?'on':''}" data-v="${n}">${n}</button>`).join('')}</div>
    <div class="sec">Durée</div><div class="chips" id="du">${[10,15,25,40].map(n=>`<button class="chip ${n===dur?'on':''}" data-v="${n}">${n} min</button>`).join('')}</div>
    <div class="sec">Prêt</div><p class="hint" style="text-align:left;padding:0 2px 10px">${countPool(sel)} éléments disponibles dans ta sélection.</p>
    <button class="btn s" id="go">Lancer l'épreuve</button></div>`;
    const ch=$('ch'); se.forEach(x=>{ const b=document.createElement('button'); b.className='chip'+(sel.has(x.id)?' on':''); b.textContent=x.id;
      b.onclick=()=>{ sel.has(x.id)?sel.delete(x.id):sel.add(x.id); draw(); }; ch.appendChild(b); });
    const all=document.createElement('button'); all.className='chip'+(sel.size===se.length?' on':''); all.textContent='Tout'; all.onclick=()=>{ sel=new Set(se.map(x=>x.id)); draw(); }; ch.appendChild(all);
    $('nq').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{nq=+b.dataset.v;draw();});
    $('du').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{dur=+b.dataset.v;draw();});
    $('go').onclick=()=>{ if(!sel.size){toast('Choisis au moins une séance');return;} go(exam,{sel:[...sel],nq,dur}); };
  }; draw();
}
function countPool(sel){ let n=0; sel.forEach(id=>{ const d=D.kanji[id]; if(d){ n+=d.kanji.length; d.kanji.forEach(k=>n+=k.vocab.length); } }); return n; }
function buildExam(sel,nq){
  const S_=new Set(sel), Q=[];
  const ks=KANJI.filter(k=>S_.has(k.seance));
  const vs=VOCAB.filter(v=>S_.has(v.seance)&&v.fr);
  const cl=CLOZE.filter(c=>S_.has(c.seance)), rd=READS.filter(r=>S_.has(r.seance));
  const star=x=>x.star===true?2:x.star===false?.6:1;
  // 1. lecture d'un mot (30%)
  sh(rd).slice(0,Math.ceil(nq*.3)).forEach(r=>Q.push({t:'lecture',lab:'Lecture',id:r.id,q:r.w,sub:r.fr,a:r.r,opts:sh([r.r,...r.d.slice(0,3)]),jp:true,k:r.w}));
  // 2. sens d'un mot (20%)
  sh(vs).slice(0,Math.ceil(nq*.2)).forEach(v=>{ const o=sh(vs.filter(x=>x.fr!==v.fr)).slice(0,3).map(x=>x.fr); if(o.length<3)return;
    Q.push({t:'sens',lab:'Sens',id:v.id,q:v.w,sub:S.opt.furi?v.r:'',a:v.fr,opts:sh([v.fr,...o]),k:v.w}); });
  // 3. kanji manquant (20%)
  sh(cl).slice(0,Math.ceil(nq*.2)).forEach(c=>Q.push({t:'trou',lab:'Kanji manquant',id:c.id,cloze:c,a:c.k,opts:sh([c.k,...c.d.slice(0,3)]),jp:true}));
  // 4. ordre des traits (15%)
  sh(ks).slice(0,Math.ceil(nq*.15)).forEach(k=>{ const n=(D.strokes[k.k]||[]).length; if(n<3)return;
    const t=1+Math.floor(Math.random()*n);
    Q.push({t:'trait',lab:'Ordre des traits',id:'k:'+k.k,stroke:{k:k.k,n:t},a:String(t),opts:sh([String(t),...sh([...Array(n).keys()].map(i=>String(i+1)).filter(x=>x!==String(t))).slice(0,3)]),ask:'stroke'}); });
  // 5. nombre de traits (5%)
  sh(ks).slice(0,Math.ceil(nq*.05)).forEach(k=>{ const n=(D.strokes[k.k]||[]).length; const o=sh([n-2,n-1,n+1,n+2,n+3].filter(x=>x>0&&x!==n)).slice(0,3).map(String);
    Q.push({t:'compte',lab:'Nombre de traits',id:'k:'+k.k,q:k.k,sub:k.fr,a:String(n),opts:sh([String(n),...o]),jp:true}); });
  // 6. thème : phrase à construire (10%)
  sh(SENT).slice(0,Math.ceil(nq*.1)).forEach(s=>Q.push({t:'theme',lab:'Thème',id:s.id,sent:s}));
  return sh(Q).slice(0,nq);
}
function exam({sel,nq,dur}){
  const Q=buildExam(sel,nq); let i=0,ans=[],t0=Date.now(),end=t0+dur*60000,locked=false;
  head('Épreuve','ne ferme pas l\'appli');
  cur.stop=()=>clearInterval(cur.tick);
  cur.tick=setInterval(()=>{ const left=Math.max(0,end-Date.now());
    $('subR').innerHTML=`<span class="timer${left<60000?' warn':''}">${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}</span>`;
    if(left<=0){ clearInterval(cur.tick); results(); } },250);
  function show(){
    if(i>=Q.length){ clearInterval(cur.tick); results(); return; }
    const q=Q[i]; locked=false; info(`<b>${i+1}</b> / ${Q.length}`,''); setBar(i/Q.length);
    if(q.t==='theme'){ const toks=sh(q.sent.tok.map((t,j)=>({t,j}))); let placed=[];
      $('view').innerHTML=`<div class="rv"><div class="exam" style="width:100%"><div class="q">${q.lab}</div></div>
        <div class="rcard" style="min-height:110px"><div class="fr">${q.sent.fr}</div></div>
        <div class="builder"><div class="slot" id="slot"></div><div class="tokens" id="tk"></div>
        <div class="tools" style="margin-top:12px"><button class="tb" id="undo">↶</button><button class="tb" id="ok">Valider</button></div></div></div>`;
      const slot=$('slot'),tk=$('tk');
      const rd=()=>{ slot.innerHTML=placed.map(p=>`<span class="tk jp">${p.t}</span>`).join(''); [...tk.children].forEach(b=>b.classList.toggle('used',placed.some(p=>p.j===+b.dataset.j))); };
      toks.forEach(o=>{ const b=document.createElement('button'); b.className='tk jp'; b.textContent=o.t; b.dataset.j=o.j; b.onclick=()=>{ if(b.classList.contains('used'))return; placed.push(o); rd(); }; tk.appendChild(b); });
      $('undo').onclick=()=>{placed.pop();rd();};
      $('ok').onclick=()=>{ if(locked)return; locked=true; const good=placed.length===q.sent.tok.length&&placed.every((p,j)=>p.j===j);
        ans.push({q,good}); grade(q.id,good?2:0); i++; setTimeout(show,180); };
      return; }
    let body='';
    if(q.t==='trou'){ const c=q.cloze; body=`<div class="cloze jp">${[...c.w].map((ch,j)=>j===c.i?'<span class="hole">?</span>':ch).join('')}</div><div class="sub">${c.fr}</div>`; }
    else if(q.t==='trait'){ body=`<div id="sw" style="width:min(56vw,200px)"></div><div class="sub">Quel est le trait n°${q.stroke.n} ?</div>`; }
    else body=`<div class="${q.jp?'mid jp':'fr'}">${q.q}</div>${q.sub?`<div class="sub">${q.sub}</div>`:''}`;
    $('view').innerHTML=`<div class="rv"><div class="exam" style="width:100%"><div class="q">${q.lab}</div></div>
      <div class="rcard">${body}</div><div class="opts" id="opts"></div></div>`;
    if(q.t==='trait'){ const box=document.createElement('div'); box.className='kbox jp'; box.style.width='min(56vw,200px)'; box.innerHTML='<div class="svgwrap" id="sw2"></div>';
      $('sw').replaceWith(box); drawKanji($('sw2'),q.stroke.k,{numbers:false,ghost:true,upto:0}); }
    const box=$('opts');
    q.opts.forEach(o=>{ const b=document.createElement('button'); b.className='opt'+(q.jp&&q.t!=='trou'?' jp':'')+(q.t==='lecture'?' jps':'');
      if(q.t==='lecture') b.style.fontSize='19px';
      b.textContent=q.t==='trait'?'trait n°'+o:o; b.dataset.v=o;
      b.onclick=()=>{ if(locked)return; locked=true; const good=o===q.a; ans.push({q,good,given:o}); grade(q.id,good?2:0);
        b.classList.add(good?'ok':'ko'); i++; setTimeout(show,180); };
      box.appendChild(b); });
  }
  function results(){
    const sec=Math.round((Date.now()-t0)/1000), ok=ans.filter(a=>a.good).length, n=ans.length||1;
    const byType={}; ans.forEach(a=>{ const t=byType[a.q.lab]=byType[a.q.lab]||{ok:0,n:0}; t.n++; if(a.good) t.ok++; });
    const wrong=ans.filter(a=>!a.good);
    const note=Math.round(ok/n*20*10)/10;
    info('',''); setBar(1);
    $('view').innerHTML=`<div class="scroll"><div class="end" style="padding-bottom:10px"><div class="big">${note}<span style="font-size:24px;color:var(--ink2)">/20</span></div>
      <p>${ok} / ${n} · ${Math.floor(sec/60)} min ${sec%60}s${ans.length<Q.length?'<br>temps écoulé avant la fin':''}</p></div>
      <div class="sec">Par type de question</div><div id="rt"></div>
      ${wrong.length?`<div class="sec">À revoir (${wrong.length})</div><div id="rw"></div>`:'<p class="hint">Sans faute.</p>'}
      <button class="btn" id="again" style="margin-top:16px">Nouvelle épreuve</button>
      <button class="btn o" id="rev">Réviser mes erreurs</button>
      <button class="btn o" id="bk">Terminer</button></div>`;
    const rt=$('rt'); Object.entries(byType).forEach(([lab,v])=>{ const p=v.ok/v.n; const d=document.createElement('div'); d.className='res';
      d.innerHTML=`<span class="lb">${lab}</span><span class="bar"><i style="width:${p*100}%;background:${p>=.8?'var(--ok)':p>=.5?'var(--gold)':'var(--ko)'}"></i></span><span class="pc">${v.ok}/${v.n}</span>`; rt.appendChild(d); });
    if(wrong.length){ const rw=$('rw'); wrong.slice(0,30).forEach(a=>{ const d=document.createElement('div'); d.className='wk';
      const q=a.q; const label=q.t==='trou'?q.cloze.w:q.t==='trait'?q.stroke.k:q.t==='theme'?'':q.q;
      d.innerHTML=`<span class="k jp">${label||'文'}</span><span class="m">${q.lab}<small>réponse : ${q.t==='theme'?q.sent.jp:q.a}${a.given?' · tu as mis '+a.given:''}</small></span>`; rw.appendChild(d); }); }
    $('again').onclick=()=>{ nav.pop(); go(exam,{sel,nq,dur}); };
    $('rev').onclick=()=>{ const items=[]; wrong.forEach(a=>{ const id=a.q.id;
      if(id.startsWith('k:')){ const k=BYK[id.slice(2)]; if(k) items.push({id,type:'kanji',k,flow:'exam'}); }
      else if(id.startsWith('c:')){ const c=CLOZE.find(x=>x.id===id); if(c) items.push({id,type:'cloze',c,flow:'exam'}); }
      else if(id.startsWith('r:')){ const r=READS.find(x=>x.id===id); if(r) items.push({id,type:'read',r,flow:'exam'}); }
      else if(id.startsWith('s:')){ const s=SENT.find(x=>x.id===id); if(s) items.push({id,type:'sent',s,flow:'exam'}); }
      else { const v=VOCAB.find(x=>x.id===id); if(v) items.push({id,type:'vocab',v,flow:'exam'}); } });
      if(!items.length){toast('Rien à réviser');return;} go(session,{items:sh(items),label:'Mes erreurs'}); };
    $('bk').onclick=()=>{ nav=[[home]]; render(); };
  }
  show();
}

/* ═══════ RÉSEAU DE KANJI ═══════ */
function reseau(){
  head('Réseau de kanji','clés et composants partagés');
  const groups={};
  KANJI.forEach(k=>{ const c=(D.comp||{})[k.k]; if(!c||!c.rad) return; (groups[c.rad]=groups[c.rad]||{fr:c.radfr,ks:[]}).ks.push(k); });
  const list=Object.entries(groups).filter(([r,g])=>g.ks.length>1&&(g.fr||[...r].length>1||g.ks.length>=4))
    .sort((a,b)=>(b[1].fr?1:0)-(a[1].fr?1:0)||b[1].ks.length-a[1].ks.length);
  info(`<b>${list.length}</b> clés partagées`,`${KANJI.length} kanji`);
  $('view').innerHTML=`<div class="scroll" style="padding-top:8px"><p class="hint" style="text-align:left;padding:0 2px 10px">Les kanji qui partagent une clé partagent souvent un domaine de sens. Repérer la clé, c'est deviner la moitié du sens.</p><div id="l"></div></div>`;
  const L=$('l');
  list.forEach(([rad,g])=>{ const d=document.createElement('div'); d.style.marginBottom='16px';
    d.innerHTML=`<div class="bloc"><h4><span class="jp" style="font-size:20px">${rad}</span> ${g.fr||''}</h4><span></span><b>${g.ks.length}</b></div>
      <div class="kgrid">${g.ks.map(k=>`<button class="kc jp l${kanjiLevel(k.k)}" data-k="${k.k}">${k.k}<em>${k.n}</em><small>${k.fr.slice(0,6)}</small></button>`).join('')}</div>`;
    L.appendChild(d); });
  L.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>go(fiche,b.dataset.k));
}

  </div>`;
}

/* ═══════ RÉGLAGES ═══════ */
function settings(){
  head('Réglages','');
  const T=(id,lab,sub,on)=>`<button class="tog ${on?'on':''}" id="${id}"><div>${lab}<small>${sub}</small></div><div class="sw"></div></button>`;
  $('view').innerHTML=`<div class="scroll" style="padding-top:8px">
    ${T('tf','Lectures affichées','Furigana au-dessus des kanji dans les listes',S.opt.furi)}
    <div class="sec">Modes de révision</div>
    ${T('m1','Japonais → français','reconnaissance, 4 choix',S.opt.modes.reco)}${T('m2','Français → japonais','rappel, 4 choix',S.opt.modes.rappel)}${T('m3','Lectures','quelle lecture pour ce mot',S.opt.modes.lecture)}${T('m5','Kanji manquant','texte à trous',S.opt.modes.trou)}${T('m4','Construction de phrase','grammaire',S.opt.modes.phrase)}${T('m6','Écrire au clavier','taper la lecture au lieu de choisir · plus dur',S.opt.modes.clavier)}
    <div class="sec">Nouveaux par jour</div>
    <div class="tools" style="justify-content:flex-start">${[4,8,12,20].map(n=>`<button class="tb ${S.opt.newPerDay===n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
    <div class="sec">Données</div>
    <button class="btn o" id="exp">Exporter ma progression</button><button class="btn o" id="imp">Importer</button>
    <button class="btn o" id="rst" style="color:var(--ko)">Tout effacer</button>
  </div>`;
  const tg=(id,fn)=>$(id).onclick=()=>{ fn(); save(); $(id).classList.toggle('on'); };
  tg('tf',()=>S.opt.furi=!S.opt.furi); tg('m1',()=>S.opt.modes.reco=!S.opt.modes.reco); tg('m2',()=>S.opt.modes.rappel=!S.opt.modes.rappel); tg('m3',()=>S.opt.modes.lecture=!S.opt.modes.lecture); tg('m4',()=>S.opt.modes.phrase=!S.opt.modes.phrase);
  tg('m5',()=>S.opt.modes.trou=!S.opt.modes.trou); tg('m6',()=>S.opt.modes.clavier=!S.opt.modes.clavier);
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ S.opt.newPerDay=+b.dataset.n; save(); document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x===b)); });
  $('exp').onclick=()=>{ const t=JSON.stringify({srs:S.srs,opt:S.opt,perso:S.perso,log:S.log}); (navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Copié dans le presse-papiers'),()=>prompt('Copie :',t)):prompt('Copie :',t)); };
  $('imp').onclick=()=>{ const t=prompt('Colle ta sauvegarde :'); if(!t)return; try{ const d=JSON.parse(t); S.srs=d.srs||{};S.opt=Object.assign(S.opt,d.opt||{});S.perso=d.perso||[];S.log=d.log||{}; save(); index(); toast('Restauré'); }catch(e){ toast('Texte invalide'); } };
  $('rst').onclick=()=>{ if(confirm('Effacer toute la progression ?')){ S.srs={};S.perso=[];S.log={}; save(); index(); toast('Effacé'); } };
}
$('setBtn').onclick=()=>go(settings);
function applyTheme(){ document.documentElement.dataset.theme=S.opt.theme; document.querySelector('meta[name=theme-color]').content=S.opt.theme==='nuit'?'#171410':'#F6F1E7'; }
$('themeBtn').onclick=()=>{ S.opt.theme=S.opt.theme==='jour'?'nuit':'jour'; save(); applyTheme(); };

/* ═══════ BOOT ═══════ */
load(); applyTheme();
loadData().then(()=>{ nav=[[home]]; render(); }).catch(e=>{ $('view').innerHTML=`<div class="loading">Impossible de charger les données.<br><small>${e.message}</small><br><small>L'appli doit être ouverte depuis un serveur (GitHub Pages), pas en fichier local.</small></div>`; });
</script>
</body>
</html>
