<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F3F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="言葉">
<link rel="apple-touch-icon" href="icon.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=3">
<link rel="icon" type="image/png" href="icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<title>言葉 — Kanji &amp; grammaire</title>
<style>
/* ═══════ v4 — encre indigo, papier d'exercice, corrections au vermillon (朱) ═══════ */
:root{--paper:#F3F4F1;--paper2:#FCFCFA;--ink:#1B2130;--ink2:#586072;--ink3:#8F97A4;--line:#E2E4DF;--line2:#CDD1CB;--seal:#C9402A;--seal2:#E0705A;--gold:#A87B22;--ok:#2F7A58;--ko:#B0383B;--sel:#E7E9E4;--grid:rgba(201,64,42,.16);--r:14px;--sh:0 1px 2px rgba(27,33,48,.06);
  --jp:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;--jps:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;--ui:-apple-system,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
html[data-theme="nuit"]{--paper:#12161F;--paper2:#1A1F2A;--ink:#E6E8EC;--ink2:#A2A8B4;--ink3:#6D7482;--line:#262C38;--line2:#353C4A;--seal:#E2583F;--seal2:#F08A74;--gold:#D3A548;--ok:#5DBB8F;--ko:#E26A6A;--sel:#232936;--grid:rgba(226,88,63,.2);--sh:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font-family:var(--ui);font-size:15px;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.jp{font-family:var(--jp)}.jps{font-family:var(--jps)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
input{font:inherit;color:inherit}
.hidden{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
/* en-tête */
.hd{display:flex;align-items:center;gap:4px;padding:10px 12px 4px 18px;min-height:54px}
.hd.deep{padding-left:6px}
.hd h1{font-size:18px;font-weight:600;flex:1;line-height:1.2;min-width:0;letter-spacing:-.005em}
.hd h1 small{display:block;font-size:12.5px;color:var(--ink2);font-weight:400;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.ib:active{background:var(--sel)}
.prog{height:2px;background:transparent;margin:0 18px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--seal);transition:width .35s}
.sub{display:flex;justify-content:space-between;padding:6px 20px 2px;font-size:12.5px;color:var(--ink2);min-height:26px}.sub:empty{display:none}.sub b{color:var(--ink);font-weight:600}
/* vues + transitions dirigées */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view.fwd{animation:inR .2s cubic-bezier(.2,.8,.3,1)}.view.bwd{animation:inL .2s cubic-bezier(.2,.8,.3,1)}.view.tab{animation:fadein .14s ease}
@keyframes inR{from{opacity:.001;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:.001;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:.001}to{opacity:1}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 32px}
/* barre d'onglets */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--paper);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 3px;color:var(--ink3);font-size:10.5px;text-align:center}
.tabs button b{font-family:var(--jp);font-size:21px;font-weight:600;line-height:1.15}
.tabs button.on{color:var(--ink)}.tabs button.on b{color:var(--seal)}
/* tuiles « papier d'exercice » (田字格) */
.tile{width:40px;height:40px;flex:none;border-radius:8px;display:grid;place-items:center;font-family:var(--jp);font-size:22px;font-weight:600;line-height:1;color:var(--ink);border:1px solid var(--line2);
  background:linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,var(--paper2)}
.tile.num{font-family:var(--ui);font-size:13px;font-weight:600}
/* lignes de liste (ex-cartes) */
.sec{font-size:13px;font-weight:600;color:var(--ink2);margin:26px 2px 4px}
.sec:first-child{margin-top:8px}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:12px 2px;border-bottom:1px solid var(--line);position:relative}
.card:active{background:var(--sel)}
.card .g{width:40px;height:40px;flex:none;border-radius:8px;display:grid;place-items:center;font-family:var(--jp);font-size:22px;font-weight:600;line-height:1;border:1px solid var(--line2);
  background:linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,var(--paper2)}
.card .b{flex:1;min-width:0}.card .b b{display:block;font-size:15px;font-weight:600}.card .b small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px;line-height:1.35}
.card .arrow{color:var(--ink3);font-size:20px;line-height:1}.card.dim{opacity:.5}
.mini-enso{width:40px;height:40px;flex:none}.mini-enso svg{width:100%;height:100%;transform:rotate(-90deg)}.mini-enso .c{fill:none;stroke:var(--line2);stroke-width:5}.mini-enso .p{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}.mini-enso.full .p{stroke:var(--seal)}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;border:1px solid var(--line2);color:var(--ink2);margin-left:6px;vertical-align:1px}
.tag.seal{border-color:var(--seal);color:var(--seal)}.tag.gold{border-color:var(--gold);color:var(--gold)}.tag.ok{border-color:var(--ok);color:var(--ok)}
/* accueil */
.home .today{font-size:13px;color:var(--ink2);margin:6px 2px 14px}
.bigrev{display:flex;align-items:center;gap:18px;width:100%;padding:20px 22px;border-radius:18px;background:var(--ink);color:var(--paper)}
.bigrev:active{opacity:.9}.bigrev .n{font-family:var(--jp);font-size:46px;font-weight:600;line-height:1;min-width:56px}
.bigrev .t{flex:1}.bigrev b{display:block;font-size:17px;font-weight:600}.bigrev small{font-size:13px;opacity:.72}
.bigrev.empty{background:var(--paper2);color:var(--ink);border:1px solid var(--line)}.bigrev.empty .n{color:var(--ink3)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.duo button{padding:13px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--paper2);font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.duo button b{font-family:var(--jp);font-size:20px}.duo button small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.cds{margin-top:22px;display:grid;gap:0}
.cd{display:flex;align-items:baseline;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.cd b{font-family:var(--jp);font-size:28px;font-weight:600;min-width:44px;color:var(--seal);line-height:1}.cd span{font-size:14px;line-height:1.35}.cd small{display:block;color:var(--ink2);font-size:12.5px}
.week{display:flex;justify-content:space-between;margin:18px 2px 0}.week div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--ink3);flex:1}
.week i{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);display:block}.week i.on{background:var(--seal);border-color:var(--seal)}.week .now{color:var(--ink);font-weight:600}
.pdj{margin:26px 0 0;padding:18px 18px 16px;border-radius:16px;border:1px solid var(--line);background:var(--paper2)}
.pdj .jp{font-size:22px;line-height:1.6}.pdj p{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.45}.pdj .row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.foot{text-align:center;color:var(--ink3);font-size:11.5px;margin-top:22px}
/* ensō */
.enso{position:relative;width:118px;height:118px;flex:none}.enso svg{width:100%;height:100%;transform:rotate(-90deg)}
.enso .c{fill:none;stroke:var(--line2);stroke-width:4}.enso .p{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)}
.enso.full .p{stroke:var(--seal)}.enso .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.enso .t b{font-family:var(--jp);font-size:32px;font-weight:600;line-height:1}.enso .t small{font-size:11px;color:var(--ink2);display:block;margin-top:2px}
.sum{display:flex;align-items:center;gap:18px;padding:8px 2px 4px}.sum p{font-size:14px;line-height:1.5;color:var(--ink2)}.sum p b{color:var(--ink);font-weight:600}
/* grille de kanji */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kc{aspect-ratio:1;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;font-size:34px;position:relative;
  background:linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat,linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,var(--paper2)}
.kc:active{transform:scale(.95)}
.kc em{position:absolute;top:4px;left:6px;font-size:9.5px;color:var(--ink3);font-style:normal;font-family:var(--ui)}
.kc small{position:absolute;bottom:4px;right:6px;font-size:9.5px;color:var(--ink3);font-family:var(--ui)}
.kc::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%}
.kc.l1::after{background:var(--ko)}.kc.l2::after{background:var(--gold)}.kc.l3::after{background:var(--ok)}.kc.l4::after{background:var(--seal);width:9px;height:9px}
.kc.l4{border-color:var(--seal)}.kc.future{opacity:.38}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);padding:6px 2px 12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;border:1px solid var(--line2)}
/* fiche kanji */
.fiche{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.kbox{width:min(62vw,240px);aspect-ratio:1;border-radius:14px;background:var(--paper2);border:1px solid var(--line2);position:relative}
.kbox svg{width:100%;height:100%;display:block}.kbox .gl{fill:none;stroke:var(--line2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.kbox .st{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}.kbox .st.hi{stroke:var(--seal)}.kbox .st.ok{stroke:var(--ok)}
.kbox .num{font-size:7px;fill:var(--seal);font-family:var(--ui);font-weight:700}
.kbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:14px}.kbox .grid-l{stroke:var(--grid);stroke-width:.8;stroke-dasharray:3 3}
.kmeta{text-align:center;margin-top:12px}.kmeta .fr{font-size:19px;font-weight:600}.kmeta .n{font-size:13px;color:var(--ink2);margin-top:2px}
.readings{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.rd{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper2);font-size:16px;display:flex;align-items:center;gap:8px}.rd b{font-size:11px;color:var(--ink3);font-weight:600}
.rd .pale{color:var(--ink3)}
.tools{display:flex;gap:6px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}
.tb{padding:8px 13px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;color:var(--ink);background:var(--paper2)}.tb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vlist{width:100%;margin-top:4px}
.vi{display:flex;align-items:baseline;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.vi .w{font-family:var(--jp);font-size:20px;min-width:86px;line-height:1.4}.vi .w rt{font-size:9px;color:var(--ink2)}.vi .r{font-size:12.5px;color:var(--ink2)}
.vi .f{flex:1;font-size:14px;line-height:1.35}.vi .f.empty{color:var(--ink3);font-style:italic}.vi .st{color:var(--seal);font-size:13px}.vi .unk{color:var(--ink3);font-size:11px}
.vi .te{font-size:13px;color:var(--gold)}.vi .te b{font-size:10px;color:var(--ink3);font-weight:600}
.notseen{color:var(--seal2);text-decoration:underline dotted;text-underline-offset:3px}
.hint{color:var(--ink2);font-size:13.5px;text-align:center;margin-top:10px;line-height:1.45;padding:0 12px;min-height:18px}
.spk{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--ink2);vertical-align:middle;flex:none;border:1px solid var(--line2);background:var(--paper2)}
.spk svg{width:15px;height:15px}.spk:active{background:var(--sel)}.spk.big{width:60px;height:60px;background:var(--ink);color:var(--paper);border:0}.spk.big svg{width:26px;height:26px}
/* révision : question en haut, réponses toujours sous le pouce */
.rv{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 18px calc(16px + env(safe-area-inset-bottom))}
.rcard{width:100%;max-width:420px;flex:1 0 auto;min-height:190px;border-radius:20px;background:var(--paper2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 20px 26px;position:relative;text-align:center}
.rcard.ko{animation:shake .32s}@keyframes shake{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.rcard .kind{position:absolute;top:13px;left:16px;right:16px;font-size:12.5px;color:var(--ink3);text-align:left}
.rcard .kind::first-letter{text-transform:uppercase}
.rcard .big{font-family:var(--jp);font-size:clamp(66px,22vw,100px);line-height:1.1}.rcard .mid{font-family:var(--jp);font-size:34px;line-height:1.35}.rcard .fr{font-size:21px;font-weight:600;line-height:1.3}
.rcard .sub{color:var(--ink2);font-size:15px;margin-top:8px;line-height:1.45}.rcard .ans{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2);width:100%}
.seal{position:absolute;right:14px;bottom:12px;width:50px;height:50px;border-radius:50%;border:3px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:var(--jp);font-size:21px;font-weight:600;transform:scale(0) rotate(-12deg);opacity:0;pointer-events:none}
.seal.on{animation:stamp .45s cubic-bezier(.2,1.4,.4,1) forwards}@keyframes stamp{0%{transform:scale(1.6) rotate(-12deg);opacity:0}60%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:.95}}
.ink{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:var(--ko);opacity:0;transform:translate(-50%,-50%) scale(0);pointer-events:none;filter:blur(6px)}
.ink.on{animation:blot .7s ease-out forwards}@keyframes blot{0%{transform:translate(-50%,-50%) scale(0);opacity:.5}100%{transform:translate(-50%,-50%) scale(4);opacity:0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px;margin-top:12px;flex:none}
.opts.one{grid-template-columns:1fr}
.opt{padding:15px 10px;border-radius:14px;background:var(--paper2);border:1px solid var(--line2);font-size:15px;text-align:center;line-height:1.3;display:flex;align-items:center;justify-content:center;min-height:58px;transition:background .12s}
.opt.jp{font-size:22px}.opt:active{background:var(--sel)}.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}.opt.dim{opacity:.35}
.opts.one .opt{justify-content:flex-start;text-align:left;min-height:50px;padding:13px 16px}
.opt svg{width:74px;height:74px}.opt .gl{fill:none;stroke:var(--line2);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.opt .st{fill:none;stroke:var(--seal);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.opt.ok .gl,.opt.ko .gl{stroke:rgba(255,255,255,.45)}.opt.ok .st,.opt.ko .st{stroke:#fff}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;max-width:420px;margin-top:12px;flex:none}
.grade button{padding:15px 6px;border-radius:14px;border:1px solid var(--line2);background:var(--paper2);font-size:14.5px;font-weight:600;text-align:center}.grade .g0{color:var(--ko)}.grade .g1{color:var(--gold)}.grade .g2{color:var(--ok)}
.reveal{width:100%;max-width:420px;margin-top:12px;padding:16px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:15px;font-weight:600;text-align:center;flex:none}
.builder{width:100%;max-width:420px;margin-top:12px;flex:none}
.slot{min-height:62px;border-radius:14px;border:1.5px dashed var(--line2);padding:9px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:var(--paper2)}.slot.ok{border-color:var(--ok)}.slot.ko{border-color:var(--ko)}
.tokens{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;justify-content:center}
.tk{padding:9px 13px;border-radius:10px;background:var(--paper2);border:1px solid var(--line2);font-size:19px;line-height:1.2}.tk:active{background:var(--sel)}.tk.used{opacity:.22;pointer-events:none}.slot .tk{background:var(--sel)}
.kbd{width:100%;max-width:420px;margin-top:12px;flex:none}.kbd input{width:100%;padding:15px;border-radius:14px;border:1.5px solid var(--line2);background:var(--paper2);font-size:22px;text-align:center}.kbd input.ok{border-color:var(--ok)}.kbd input.ko{border-color:var(--ko)}
/* éléments de phrase */
.segs{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 3px;margin-top:6px;font-family:var(--jp);font-size:25px;line-height:1.4}
.seg{padding:3px 5px;border-radius:8px;border:1px solid transparent}
button.seg{border-color:var(--line2);background:var(--paper)}button.seg:active{background:var(--sel)}
.seg.hl{background:var(--seal);color:#fff;border-color:var(--seal)}.seg.okk{background:var(--ok);color:#fff;border-color:var(--ok)}.seg.kok{background:var(--ko);color:#fff;border-color:var(--ko)}
.seg.hole{min-width:1.6em;border:0;border-bottom:2.5px solid var(--seal);border-radius:0;color:var(--seal);text-align:center}
.qtask{font-size:16px;font-weight:600;margin-top:14px;line-height:1.35}
/* textes */
.txt{font-family:var(--jp);font-size:19px;line-height:1.95;text-align:left;width:100%}
.txt.kana{font-size:18px}
.tq{width:100%;max-width:420px;margin-top:14px;text-align:left}.tq h4{font-size:15px;font-weight:600;margin:0 2px 8px}
.txtfr{font-size:13.5px;color:var(--ink2);line-height:1.5;margin-top:12px;text-align:left;border-top:1px dashed var(--line2);padding-top:10px;width:100%}
/* divers */
.end{text-align:center;padding:34px 20px}.end .big{font-family:var(--jp);font-size:58px;font-weight:600}.end p{color:var(--ink2);margin:10px 0 22px;line-height:1.55}
.pt{padding:14px 2px 12px;border-bottom:1px solid var(--line)}.pt h3{font-size:16px;font-weight:600;margin-bottom:6px}
.pt .why{color:var(--ink2);font-size:13.5px;line-height:1.5;margin-bottom:8px}.ex{padding:8px 0;display:flex;gap:10px;align-items:flex-start}
.ex .j{font-family:var(--jp);font-size:19px;line-height:1.6;flex:1}.ex .f{font-family:var(--ui);font-size:13px;color:var(--ink2);margin-top:1px;line-height:1.4}
.field{margin-bottom:10px}.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--paper2);font-size:16px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:15.5px;font-weight:600;text-align:center;margin-top:8px}.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line2)}.btn.s{background:var(--seal);color:#fff}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;font-size:15px}.tog small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.sw{width:44px;height:26px;flex:none;border-radius:13px;background:var(--line2);position:relative;transition:background .15s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on .sw{background:var(--seal)}.tog.on .sw::after{left:21px}
.about p{font-size:15px;line-height:1.6;margin-bottom:12px}.about h3{font-size:15px;font-weight:600;margin:22px 0 6px}.about a{color:var(--seal);text-decoration:none;font-weight:600}
.toast{position:fixed;left:18px;right:18px;top:calc(10px + env(safe-area-inset-top));background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 16px;z-index:30;transform:translateY(-140%);transition:transform .32s cubic-bezier(.2,.9,.3,1);text-align:center;font-size:14px}.toast.on{transform:none}
.loading{flex:1;display:grid;place-items:center;color:var(--ink2);font-size:14px;text-align:center;padding:20px;line-height:1.5}
.bloc{margin:20px 0 8px;display:flex;align-items:baseline;gap:10px}.bloc h4{font-size:14px;font-weight:600;color:var(--ink)}.bloc span{flex:1;height:1px;background:var(--line)}.bloc b{font-size:12px;color:var(--ink3);font-weight:500}
.step{display:flex;gap:5px;justify-content:center;margin:2px 0 8px}.step i{width:22px;height:3px;border-radius:2px;background:var(--line2)}.step i.on{background:var(--ink)}.step i.done{background:var(--seal)}
.blob{text-align:center;padding:26px 16px}.blob .lab{font-size:13px;color:var(--ink2)}.blob h2{font-size:25px;font-weight:600;margin:6px 0 6px}.blob p{color:var(--ink2);font-size:14px;line-height:1.5}.blob .ks{font-family:var(--jp);font-size:32px;letter-spacing:.12em;margin:16px 0 4px;line-height:1.5}
.comp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.comp .cp{padding:7px 12px;border-radius:10px;background:var(--paper2);border:1px solid var(--line);font-family:var(--jp);font-size:22px;line-height:1.2;text-align:center}.comp .cp small{display:block;font-size:10.5px;color:var(--ink3);font-family:var(--ui);margin-top:2px}.comp .cp.rad{border-color:var(--seal);color:var(--seal)}
.cloze{font-family:var(--jp);font-size:34px;letter-spacing:.06em;line-height:1.5}.cloze .hole{display:inline-block;min-width:44px;border-bottom:3px solid var(--seal);color:var(--seal)}
.res{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}.res .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.res .bar i{display:block;height:100%;border-radius:3px}.res .lb{font-size:13.5px;min-width:120px}.res .pc{font-size:13px;color:var(--ink2);min-width:52px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;background:var(--paper2)}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}.chip.dim{opacity:.4}
.timer{font-variant-numeric:tabular-nums;font-weight:600}.timer.warn{color:var(--ko)}
.wk{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}.wk .k{font-family:var(--jp);font-size:24px;min-width:40px}.wk .m{flex:1;font-size:13.5px}.wk .m small{display:block;color:var(--ink2);font-size:12.5px}
.lives{display:flex;gap:6px;justify-content:center}.lives i{width:11px;height:11px;border-radius:50%;background:var(--seal)}.lives i.off{background:var(--line2)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;width:100%;max-width:400px;margin:6px auto}.duel .side{text-align:center;padding:12px;border-radius:12px;background:var(--paper2);border:1px solid var(--line)}.duel .side b{font-family:var(--jp);font-size:28px;display:block}.duel .side small{color:var(--ink2);font-size:12px}.duel .vs{color:var(--ink3);font-size:12px}
.rt{display:grid;grid-template-columns:34px 44px 1fr 1fr;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}.rt .c{font-family:var(--jp);font-size:24px}.rt small{color:var(--ink2)}
.srch{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--paper2);font-size:15px;margin-bottom:10px}
.pos7{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.pos7 div{text-align:center;font-size:11px;color:var(--ink2)}.pos7 svg{width:100%;aspect-ratio:1;display:block;margin-bottom:4px}.pos7 rect{fill:var(--line);stroke:var(--line2)}.pos7 rect.k{fill:var(--seal2)}
@media (min-width:700px){.scroll,.rv{padding-left:max(18px,calc(50% - 320px));padding-right:max(18px,calc(50% - 320px))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
<div id="app">
  <div class="hd" id="hd"><button class="ib hidden" id="back" aria-label="Retour"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1 id="title">言葉</h1><button class="ib" id="themeBtn" aria-label="Thème jour ou nuit"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button><button class="ib" id="setBtn" aria-label="Réglages"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="sub"><span id="subL"></span><span id="subR"></span></div>
  <div class="view" id="view"><div class="loading">Chargement…</div></div>
  <nav class="tabs" id="tabs"><button data-tab="home"><b>今</b>Aujourd'hui</button><button data-tab="kanji"><b>字</b>Kanji</button><button data-tab="gram"><b>文</b>Grammaire</button><button data-tab="train"><b>練</b>S'entraîner</button></nav>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ═══════ ÉTAT ═══════ */
const $=id=>document.getElementById(id);
const KEY='kotoba-v1', DAY=864e5;
let D={manifest:null,kanji:{},gram:{},strokes:{},comp:{},cloze:[],read:[],cles:[],coursCles:null,lex:{verbs:[],adjs:[]},td:{roles:{},phrases:[],textes:[]}};
let S={srs:{},opt:{theme:'jour',furi:false,newPerDay:8,audio:true,autoSpeak:false,games:true,modes:{reco:true,rappel:true,lecture:true,phrase:true,trou:true,clavier:false,ecoute:true,te:true,contraire:true,cle:true,elem:true}},perso:[],log:{},unlocked:{},best:{}};
let nav=[],cur={};
function load(){ try{ const v=localStorage.getItem(KEY); if(v){ const d=JSON.parse(v); S.srs=d.srs||{}; S.opt=Object.assign(S.opt,d.opt||{}); S.opt.modes=Object.assign({reco:true,rappel:true,lecture:true,phrase:true,trou:true,clavier:false,ecoute:true,te:true,contraire:true,cle:true,elem:true},d.opt&&d.opt.modes||{}); S.perso=d.perso||[]; S.log=d.log||{}; S.unlocked=d.unlocked||{}; S.best=d.best||{}; } }catch(e){} }
let sT; function save(){ clearTimeout(sT); sT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify({srs:S.srs,opt:S.opt,perso:S.perso,log:S.log,unlocked:S.unlocked,best:S.best})); }catch(e){} },200); }
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>sh(a).slice(0,n);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toast(t){ $('toast').textContent=t; $('toast').classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>$('toast').classList.remove('on'),2600); }
function vib(p){ try{navigator.vibrate&&navigator.vibrate(p)}catch(e){} }
function fdate(s){ if(!s) return ''; const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const hasKan=w=>/[\u4e00-\u9fff々]/.test(w||'');
/* comparaison de kana tolérante : katakana = hiragana, alternatives séparées par ・ ou ／, sans ～ ni espaces */
const toHira=t=>String(t).normalize('NFKC').replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const nk=t=>toHira(t).replace(/[\s～〜~、。.,!?？！]/g,'');
const kanaOK=(input,r)=>{ const a=nk(input); if(!a) return false; return [r,...String(r).split(/[・／/]/)].some(x=>nk(x)===a); };
const ICON={spk:'<svg class="i" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'};

/* ═══════ AUDIO ═══════ */
const TTS={voice:null,ok:false,tried:false,
  init(){ if(!('speechSynthesis' in window)) return; const pick=()=>{ const vs=speechSynthesis.getVoices()||[]; TTS.voice=vs.find(v=>/^ja/i.test(v.lang)&&/Kyoko|Google|O-Ren|Hattori|Otoya/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null; TTS.ok=!!TTS.voice; TTS.tried=true; };
    pick(); try{ speechSynthesis.onvoiceschanged=pick; }catch(e){} setTimeout(pick,800); },
  speak(t,rate){ if(!S.opt.audio||!t) return false; if(!TTS.ok){ TTS.init(); if(!TTS.ok) return false; } try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.voice=TTS.voice; u.rate=rate||.88; u.pitch=1; speechSynthesis.speak(u); return true; }catch(e){ return false; } }
};
const spk=(t,big)=>(S.opt.audio&&TTS.ok)?`<button class="spk${big?' big':''}" data-say="${esc(t)}" aria-label="Écouter">${ICON.spk}</button>`:'';
document.addEventListener('click',e=>{ const b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); TTS.speak(b.dataset.say); } });
const sayable=t=>String(t).replace(/[（(].*?[）)]/g,'').split(/[／/]/)[0].replace(/[〜~*]/g,'').trim();

/* ═══════ DONNÉES ═══════ */
async function loadData(){
  const m=await (await fetch('data/manifest.json',{cache:'no-store'})).json(); D.manifest=m;
  const J=(u,f)=>fetch(u).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(f).catch(()=>{});
  const jobs=[];
  m.cours.kanji.seances.forEach(s=>jobs.push(J('data/kanji/'+s.id+'.json',j=>D.kanji[s.id]=j)));
  m.cours.grammaire.lecons.forEach(l=>jobs.push(J('data/grammaire/'+l.id+'.json',j=>D.gram[l.id]=j)));
  jobs.push(J('data/grammaire/_lexique.json',j=>D.lex=j));
  jobs.push(J('data/strokes.json',j=>D.strokes=j)); jobs.push(J('data/components.json',j=>D.comp=j));
  jobs.push(J('data/cloze.json',j=>D.cloze=j)); jobs.push(J('data/readings.json',j=>D.read=j));
  jobs.push(J('data/cles.json',j=>D.cles=j)); jobs.push(J('data/cours_cles.json',j=>D.coursCles=j));
  const td=m.cours.td; if(td){ if(td.elements) jobs.push(J('data/'+td.elements,j=>{ if(j&&Array.isArray(j.phrases)){ D.td.roles=j.roles||{}; D.td.phrases=j.phrases; } }));
    if(td.textes) jobs.push(J('data/'+td.textes,j=>{ if(j&&Array.isArray(j.textes)) D.td.textes=j.textes; })); }
  await Promise.all(jobs); index();
}
let KANJI=[],VOCAB=[],SENT=[],BYK={},CLOZE=[],READS=[],VERBS=[],ADJS=[],CLEBY={},ELEMS=[],TEXTES=[];
function index(){
  KANJI=[];VOCAB=[];SENT=[];BYK={};
  Object.values(D.kanji).sort((a,b)=>a.range[0]-b.range[0]).forEach(s=>{ s.kanji.forEach(k=>{ k.seance=s.id; k.date=s.date; KANJI.push(k); BYK[k.k]=k;
    (k.vocab||[]).forEach(v=>{ const id='v:'+v.w+'/'+v.r; if(v.prev) mig(v.prev,id); VOCAB.push({...v,kanji:k.k,seance:s.id,id,src:'kanji'}); }); }); });
  Object.values(D.gram).forEach(g=>{
    (g.vocab||[]).forEach(e=>{ const [w,fr,r,pos,old]=Array.isArray(e)?e:[e.w,e.fr,e.r,e.pos,e.old]; if(!w) return; const id='v:'+w+'/'+g.id; if(old) mig('v:'+old+'/'+g.id,id); VOCAB.push({w,r:r||'',fr,pos:pos||'',star:true,seance:g.id,id,src:'gram'}); });
    (g.points||[]).forEach((p,pi)=>p.ex.forEach((e,ei)=>{ if(e.tok&&e.tok.length>1) SENT.push({...e,id:'s:'+g.id+':'+pi+':'+ei,lecon:g.id,point:p.t}); }));
  });
  S.perso.forEach(p=>VOCAB.push({w:p.w,r:p.r,fr:p.fr,star:false,seance:'perso',id:'v:perso:'+p.w,src:'perso'}));
  CLOZE=(D.cloze||[]).filter(c=>D.kanji[c.seance]); READS=(D.read||[]).filter(r=>D.kanji[r.seance]);
  VERBS=(D.lex.verbs||[]).map(v=>({...v,id:'te:'+v.w,lecon:v.les?'L'+String(v.les).padStart(2,'0'):null}));
  ADJS=(D.lex.adjs||[]).map(a=>({...a,id:'adj:'+a.w,lecon:'L'+String(a.les).padStart(2,'0')}));
  CLEBY={}; (D.cles||[]).forEach(c=>CLEBY[c.n]=c);
  ELEMS=(D.td.phrases||[]).filter(p=>p&&Array.isArray(p.seg)&&p.seg.length).map(p=>({id:'el:'+p.id,type:'elem',p,lecon:p.lecon,flow:'exam'}));
  TEXTES=(D.td.textes||[]).filter(t=>t&&t.jp&&Array.isArray(t.q)).map(t=>({id:'tx:'+t.id,type:'texte',t,lecon:t.lecon,flow:'exam'}));
  if(mig.n){ mig.n=0; save(); }
}
/* report de progression quand un identifiant change (coquille corrigée) */
function mig(from,to){ if(from!==to&&S.srs[from]&&!S.srs[to]){ S.srs[to]=S.srs[from]; mig.n=(mig.n||0)+1; } }
const unlocked=id=>{ const d=D.kanji[id]||D.gram[id]; if(!d) return true; if(S.unlocked[id]) return true; return !!d.date&&d.date<=today(); };
const kanjiSeen=k=>{ const x=BYK[k]; return x?unlocked(x.seance):true; };
const cleOf=k=>{ const c=(D.comp||{})[k]; return c&&c.cle?CLEBY[c.cle]:null; };

/* ═══════ SRS ═══════ */
const st=id=>S.srs[id]||null;
const isDue=id=>{ const s=st(id); return s&&s.due<=Date.now(); };
function grade(id,g,w){ // g: 0 raté 1 dur 2 facile ; w: poids (jeux)
  let s=S.srs[id]||{iv:0,ease:2.3,reps:0,lapses:0};
  if(g===0){ s.iv=0; s.lapses++; s.ease=Math.max(1.3,s.ease-.2); s.due=Date.now()+10*60e3; }
  else if(g===1){ s.iv=Math.max(1,Math.round(s.iv*1.2)||1); s.ease=Math.max(1.3,s.ease-.12); s.due=Date.now()+s.iv*DAY; }
  else { const nxt=s.iv===0?1:s.iv===1?3:Math.round(s.iv*s.ease); s.iv=w&&w<1?Math.max(s.iv,Math.round(s.iv+(nxt-s.iv)*w)):nxt; s.ease=Math.min(2.8,s.ease+.05); s.due=Date.now()+s.iv*DAY; }
  s.reps++; s.last=Date.now(); S.srs[id]=s; const t=today(); S.log[t]=(S.log[t]||0)+1; save();
}
const lvl=id=>{ const s=st(id); if(!s) return 0; if(s.iv<3) return 1; if(s.iv<10) return 2; if(s.iv<30) return 3; return 4; };
const kanjiLevel=k=>lvl('k:'+k);
const flowOf=v=>v.star===false?'enrich':'exam';
function poolItems(){
  const it=[], M=S.opt.modes;
  KANJI.forEach(k=>{ if(kanjiSeen(k.k)) it.push({id:'k:'+k.k,type:'kanji',k,flow:'exam'}); });
  VOCAB.forEach(v=>{ if(v.seance==='perso'||unlocked(v.seance)) it.push({id:v.id,type:'vocab',v,flow:flowOf(v)}); });
  if(M.phrase) SENT.forEach(s=>{ if(unlocked(s.lecon)) it.push({id:s.id,type:'sent',s,flow:'exam'}); });
  if(M.trou) CLOZE.forEach(c=>{ if(unlocked(c.seance)) it.push({id:c.id,type:'cloze',c,flow:c.star===false?'enrich':'exam'}); });
  if(M.lecture) READS.forEach(r=>{ if(unlocked(r.seance)) it.push({id:r.id,type:'read',r,flow:r.star===false?'enrich':'exam'}); });
  if(M.te) VERBS.forEach(v=>{ if(v.te&&(!v.lecon||unlocked(v.lecon))) it.push({id:v.id,type:'te',v,flow:'exam'}); });
  if(M.contraire) ADJS.forEach(a=>{ if(a.opp.length&&unlocked(a.lecon)) it.push({id:a.id,type:'opp',a,flow:'exam'}); });
  if(M.cle) KANJI.forEach(k=>{ const c=cleOf(k.k); if(c&&kanjiSeen(k.k)&&!(D.comp[k.k]||{}).self) it.push({id:'cle:'+k.k,type:'cle',k,c,flow:'enrich'}); });
  if(M.elem) ELEMS.forEach(e=>{ if(unlocked(e.lecon)) it.push(e); });
  return it;
}
function dueLists(){ const all=poolItems(), due=all.filter(i=>isDue(i.id)), fresh=all.filter(i=>!st(i.id));
  return {all,due,fresh,dueExam:due.filter(i=>i.flow==='exam'),dueEnrich:due.filter(i=>i.flow==='enrich'),freshExam:fresh.filter(i=>i.flow==='exam'),freshEnrich:fresh.filter(i=>i.flow==='enrich')}; }
function pickNew(list,n){ const by=t=>list.filter(i=>i.type===t); const k=by('kanji').sort((a,b)=>a.k.n-b.k.n), v=by('vocab'), s=by('sent'), o=list.filter(i=>!['kanji','vocab','sent'].includes(i.type));
  const out=[]; let i=0; while(out.length<n&&(k[i]||v[i]||s[i]||o[i])){ if(k[i]) out.push(k[i]); if(v[i]&&out.length<n) out.push(v[i]); if(s[i]&&out.length<n&&i%2===0) out.push(s[i]); if(o[i]&&out.length<n&&i%3===0) out.push(o[i]); i++; } return out; }

/* ═══════ NAVIGATION ═══════ */
/* onglets : chaque onglet a sa racine ; les écrans d'exercice masquent la barre pour laisser la place */
let TAB='home';
const ROOTS={home:()=>home,kanji:()=>kanjiCourse,gram:()=>gramCourse,train:()=>trainHome};
const FOCUS=new Set([session,quizMulti,duel,survival,exam,traceRun,decouvrir]);
function go(fn,arg){ nav.push([fn,arg]); render('fwd'); }
function back(){ if(nav.length>1) nav.pop(); render('bwd'); }
function home_(){ nav=[[ROOTS[TAB]()]]; render('bwd'); }
function setTab(t){ if(!ROOTS[t]) t='home'; TAB=t; nav=[[ROOTS[t]()]]; render('tab'); }
function render(dir){ cur.stop&&cur.stop(); cur={id:Math.random()}; const [fn,arg]=nav[nav.length-1]; const v=$('view'); v.innerHTML=''; v.className='view';
  if(dir){ void v.offsetWidth; v.classList.add(dir); }
  $('back').classList.toggle('hidden',nav.length<=1); $('hd').classList.toggle('deep',nav.length>1);
  $('tabs').classList.toggle('hidden',FOCUS.has(fn)); document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  setBar(0); info('',''); try{ speechSynthesis&&speechSynthesis.cancel(); }catch(e){} fn(arg); }

  let others=distinct(sh(pool.filter(x=>x.seance===v.seance)).concat(sh(pool)),x=>x.r).slice(0,3);
  const card=stageQ('quelle lecture ?',`<div class="mid jp">${v.w}</div><div class="sub">${v.fr}</div>`);
  const list=sh([v.r,...others.map(x=>x.r)]).map((x,i)=>({v:x,ok:x===v.r,i}));
  const box=optsBox(list,x=>`<span class="jps" style="font-size:18px">${x}</span>`,good=>{ stamp(card,good); if(S.opt.autoSpeak) TTS.speak(sayable(v.r)); cb(good,good?2:0); }); card.parentNode.appendChild(box); };
/* traduire une phrase japonaise (choix du sens) */
CARDS.sentfr=(it,cb)=>{ const s_=it.s; let others=distinct(sh(SENT.filter(x=>x.id!==s_.id&&x.fr!==s_.fr&&x.lecon===s_.lecon)).concat(sh(SENT.filter(x=>x.fr!==s_.fr))),x=>x.fr).slice(0,3);
  const card=stageQ('traduis la phrase',`<div class="jp" style="font-size:24px;line-height:1.6">${s_.jp}</div><div style="margin-top:8px">${spk(s_.jp)}</div>`);
  const list=sh([s_,...others]).map((x,i)=>({v:x.fr,ok:x.id===s_.id,i}));
  const box=optsBox(list,x=>x,good=>{ stamp(card,good); cb(good,good?2:0); }); box.classList.add('one'); card.parentNode.appendChild(box); };
const roleOf=seg=>(seg[1]||'').split('|').filter(Boolean);
const segHTML=(p,f)=>p.seg.map((sg,i)=>f(sg,i)).join('');
/* identifier un élément : « touche le verbe » */
CARDS.elem=(it,cb)=>{ const p=it.p, R_=D.td.roles; const roles=distinct(p.seg.flatMap(roleOf),x=>x).filter(r=>R_[r]); if(!roles.length) return cb(true,2);
  const role=roles[Math.random()*roles.length|0];
  const card=stageQ('identifie les éléments',`<div class="segs">${segHTML(p,(sg,i)=>/^[、。]$/.test(sg[0])?`<span class="seg">${sg[0]}</span>`:`<button class="seg" data-i="${i}">${sg[0]}</button>`)}</div><div class="sub">${p.fr}</div><div class="qtask">Touche ${R_[role][0]}.</div>`);
  let done=false; const btns=[...card.querySelectorAll('button.seg')];
  btns.forEach(b=>b.onclick=()=>{ if(done)return; done=true; const good=roleOf(p.seg[+b.dataset.i]).includes(role);
    btns.forEach(x=>{ if(roleOf(p.seg[+x.dataset.i]).includes(role)) x.classList.add('okk'); }); if(!good) b.classList.add('kok'); stamp(card,good); cb(good,good?2:0); }); };
/* rôle d'un élément surligné */
CARDS.erole=(it,cb)=>{ const p=it.p, R_=D.td.roles; const cand=p.seg.map((sg,i)=>({sg,i})).filter(x=>roleOf(x.sg).some(r=>R_[r])); if(!cand.length) return CARDS.elem(it,cb);
  const c=cand[Math.random()*cand.length|0], mine=roleOf(c.sg).filter(r=>R_[r]), role=mine[Math.random()*mine.length|0], isP=r=>r.startsWith('p-');
  const pool=Object.keys(R_).filter(r=>!mine.includes(r)); let others=pick(pool.filter(r=>isP(r)===isP(role)),3); if(others.length<3) others=others.concat(pick(pool.filter(r=>!others.includes(r)),3-others.length));
  const card=stageQ('rôle dans la phrase',`<div class="segs">${segHTML(p,(sg,i)=>`<span class="seg${i===c.i?' hl':''}">${sg[0]}</span>`)}</div><div class="sub">${p.fr}</div><div class="qtask">Quel est le rôle de l'élément en couleur ?</div>`);
  const list=sh([role,...others]).map((x,i)=>({v:x,ok:x===role,i}));
  const box=optsBox(list,x=>R_[x][1],good=>{ stamp(card,good); cb(good,good?2:0); }); box.classList.add('one'); card.parentNode.appendChild(box); };
/* particule manquante */
const PARTS=['は','も','の','か','に','から','まで','と'];
const hasPart=p=>p.seg.some(sg=>roleOf(sg).some(r=>r.startsWith('p-')));
CARDS.epart=(it,cb)=>{ const p=it.p; const cand=p.seg.map((sg,i)=>({sg,i})).filter(x=>roleOf(x.sg).some(r=>r.startsWith('p-'))); if(!cand.length) return CARDS.elem(it,cb);
  const c=cand[Math.random()*cand.length|0], ans=c.sg[0];
  const card=stageQ('quelle particule ?',`<div class="segs">${segHTML(p,(sg,i)=>i===c.i?`<span class="seg hole" id="hole">？</span>`:`<span class="seg">${sg[0]}</span>`)}</div><div class="sub">${p.fr}</div>`);
  const list=sh([ans,...pick(PARTS.filter(x=>x!==ans),3)]).map((x,i)=>({v:x,ok:x===ans,i}));
  const box=optsBox(list,x=>x,good=>{ $('hole').textContent=ans; stamp(card,good); cb(good,good?2:0); },'jp'); card.parentNode.appendChild(box); };
/* comprendre un petit texte : toutes les questions sur la même carte */
CARDS.texte=(it,cb)=>{ const t=it.t; let kana=false, answered=0, right=0;
  const card=stageQ('comprends le texte · '+t.titre,`<div class="txt" id="tx">${t.jp}</div><div class="tools" style="justify-content:flex-start;align-self:stretch;margin-top:12px"><button class="tb" id="kn">Lire en kana</button>${spk(t.kana||t.jp)}</div>`,`<div id="qs" style="width:100%;max-width:420px"></div>`);
  card.style.flex='none'; card.style.justifyContent='flex-start';
  $('kn').onclick=()=>{ kana=!kana; $('tx').textContent=kana?(t.kana||t.jp):t.jp; $('tx').classList.toggle('kana',kana); $('kn').classList.toggle('on',kana); };
  const finish=()=>{ const good=right===t.q.length; stamp(card,good);
    $('qs').insertAdjacentHTML('beforeend',`<div class="txtfr">${t.fr||''}</div><button class="btn" id="cont" style="margin-top:14px">Continuer</button>`);
    $('cont').onclick=()=>cb(good,good?2:right*2>=t.q.length?1:0); };
  t.q.forEach((q,qi)=>{ const w=document.createElement('div'); w.className='tq'; w.innerHTML=`<h4>${qi+1}. ${q.q}</h4>`;
    const list=sh(q.o.map((o,i)=>({o,ok:i===q.a}))).map((x,i)=>({v:x.o,ok:x.ok,i}));
    const box=optsBox(list,x=>x,good=>{ answered++; if(good) right++; if(answered===t.q.length) finish(); }); box.classList.add('one'); box.style.marginTop='0'; w.appendChild(box); $('qs').appendChild(w); }); };

CARDS.prod=(it,cb)=>{ /* français → japonais, choix parmi 4 (production) */ const v=it.v; CARDS.vocab(it,cb,{mode:'rappel'}); };

CARDS.stroke=(it,cb)=>{ const k=it.k, n=(D.strokes[k.k]||[]).length; if(n<2) return CARDS.ksens(it,cb); const target=it.target!=null?it.target:Math.floor(Math.random()*n);
  const card=stageQ(`ordre des traits`,`<div class="big jp" style="font-size:64px">${k.k}</div><div class="sub">Quel est le trait n°${target+1} ?</div>`);
  const list=strokeOptions(k.k,target).map((idx,i)=>({v:idx,ok:idx===target,i}));
  const box=optsBox(list,idx=>miniKanji(k.k,idx),good=>{ stamp(card,good); cb(good,good?2:0); }); card.parentNode.appendChild(box); };

CARDS.count=(it,cb)=>{ const k=it.k, n=(D.strokes[k.k]||[]).length; const o=pick([n-2,n-1,n+1,n+2,n+3].filter(x=>x>0&&x!==n),3);
  const card=stageQ('nombre de traits',`<div class="big jp">${k.k}</div><div class="sub">${k.fr}</div>`);
  const list=sh([n,...o]).map((x,i)=>({v:x,ok:x===n,i}));
  const box=optsBox(list,x=>x+' traits',good=>{ stamp(card,good); cb(good,good?2:0); }); card.parentNode.appendChild(box); };

/* rendu générique d'un item selon un angle */
function renderItem(it,angle,cb,o){
  o=o||{};
  switch(angle||it.type){
    case 'kanji': return CARDS.kanji(it,cb,o);
    case 'ksens': return CARDS.ksens(it,cb);
    case 'kcle': { const c=cleOf(it.k.k); if(!c) return CARDS.ksens(it,cb); return CARDS.kcle({...it,c},cb); }
    case 'stroke': return CARDS.stroke(it,cb);
    case 'count': return CARDS.count(it,cb);
    case 'vocab': case 'reco': return CARDS.vocab(it,cb,{first:o.first,mode:'reco'});
    case 'rappel': return CARDS.vocab(it,cb,{mode:'rappel'});
    case 'clavier': return it.type==='read'?CARDS.read(it,cb,{mode:'clavier'}):CARDS.vocab(it,cb,{mode:'clavier'});
    case 'listen': return TTS.ok?CARDS.listen(it,cb,{mode:'sens'}):CARDS.vocab(it,cb,{mode:'reco'});
    case 'listenw': return TTS.ok?CARDS.listen(it,cb,{mode:'ecriture'}):CARDS.vocab(it,cb,{mode:'rappel'});
    case 'dictee': return TTS.ok?CARDS.dictee(it,cb):CARDS.vocab(it,cb,{mode:'clavier'});
    case 'cloze': return CARDS.cloze(it,cb);
    case 'read': return CARDS.read(it,cb,o);
    case 'lecture2': return CARDS.lecture2(it,cb);
    case 'sent': return CARDS.sent(it,cb);
    case 'te': return CARDS.te(it,cb,o);
    case 'opp': return CARDS.opp(it,cb);
    case 'cle': return CARDS.kcle(it,cb);
    case 'clesens': return CARDS.clesens(it,cb);
    case 'gread': return it.v&&hasKan(it.v.w)?CARDS.gread(it,cb):CARDS.vocab(it,cb,{mode:'reco'});
    case 'sentfr': return CARDS.sentfr(it,cb);
    case 'elem': return CARDS.elem(it,cb);
    case 'erole': return CARDS.erole(it,cb);
    case 'epart': return CARDS.epart(it,cb);
    case 'texte': return CARDS.texte(it,cb);
    default: return CARDS.vocab(it,cb,o);
  }
}
/* angles possibles pour un item (quiz multi-angles) */
function anglesFor(it){
  const A=[]; const M=S.opt.modes, hasAudio=TTS.ok&&M.ecoute;
  if(it.type==='kanji'){ A.push('ksens','stroke','count'); if(cleOf(it.k.k)&&!(D.comp[it.k.k]||{}).self) A.push('kcle'); }
  else if(it.type==='vocab'){ A.push('reco'); if(!it.v.kana) A.push('rappel'); if(it.v.src==='gram'&&hasKan(it.v.w)&&it.v.r&&it.v.r!==it.v.w) A.push('gread'); if(M.clavier&&it.v.r) A.push('clavier'); if(hasAudio&&it.v.r){ A.push('listen'); if(!it.v.kana) A.push('listenw'); } if(hasAudio&&M.clavier&&it.v.r) A.push('dictee'); }
  else if(it.type==='read'){ A.push('read','lecture2'); if(M.clavier) A.push('clavier'); }
  else if(it.type==='cloze') A.push('cloze'); else if(it.type==='sent') A.push('sent','sentfr');
  else if(it.type==='elem'){ A.push('elem','erole'); if(hasPart(it.p)) A.push('epart'); } else if(it.type==='texte') A.push('texte');
  else if(it.type==='te'){ A.push('te'); if(M.clavier) A.push('te'); } else if(it.type==='opp') A.push('opp'); else if(it.type==='cle') A.push('cle');
  return A; }
/* ═══════ SESSION (révision) ═══════ */
function session({items,label,onEnd,free,weight}){
  let q=items.slice(), i=0, total=q.length, ok=0, ko=0; const again=[];
  head(label||'Révision',free?'ne compte pas dans la progression':'');
  const next=()=>{ if(!q.length){ if(again.length&&!free) q=sh(again.splice(0)); else { fin(); return; } }
    const it=q.shift(); info(`<b>${i}</b> / ${total}`,ko?'raté '+ko:''); setBar(i/Math.max(total,1));
    const first=!st(it.id);
    let angle=it.angle||null;
    if(!angle){ if(it.type==='vocab'){ const A=anglesFor(it).filter(a=>a!=='reco'||true); angle=first?'reco':(A.length?A[Math.random()*A.length|0]:'reco'); }
      else if(it.type==='read'&&S.opt.modes.clavier&&!first&&Math.random()<.4) angle='clavier';
      else if(it.type==='sent'&&!first&&Math.random()<.35) angle='sentfr';
      else if(it.type==='elem'){ const A=anglesFor(it); angle=A[Math.random()*A.length|0]; } else if(it.type==='te'&&S.opt.modes.clavier&&!first&&Math.random()<.5) return renderItem(it,'te',(g,gr)=>done(it,g,gr),{mode:'clavier'}); }
    renderItem(it,angle,(g,gr)=>done(it,g,gr),{first}); };
  const done=(it,good,g)=>{ if(!free) grade(it.id,g,weight); i++; if(!good){ ko++; if(!free) again.push(it); } else ok++; later(next,good?520:950); };
  const fin=()=>{ setBar(1); info('',''); $('view').innerHTML=`<div class="end"><div class="big jp">${ko===0?'完':'了'}</div><p>${total} carte${total>1?'s':''} · ${ok} réussie${ok>1?'s':''} · ${ko} à revoir<br>${free?'Session libre, rien n\'a été enregistré.':ko===0?'Sans faute.':'Les ratés reviennent dans dix minutes.'}</p><button class="btn" id="bk">Terminer</button></div>`;
    $('bk').onclick=()=>{ if(onEnd) onEnd(); else home_(); }; };
  next(); }

  $('nums').onclick=()=>{ nums=!nums; $('nums').classList.toggle('on',nums); if(mode==='view') show(); };
  $('trace').onclick=()=>{ mode='trace'; $('trace').classList.add('on'); if($('quizt')) $('quizt').classList.remove('on'); kb.querySelectorAll('canvas').forEach(c=>c.remove()); $('hint').textContent='Trace le trait 1';
    eng=traceEngine(kb,k,err=>{ $('hint').innerHTML=(err?`Terminé avec ${err} erreur${err>1?'s':''}.`:'Sans faute.')+` <button class="tb" id="again">Refaire</button>`; $('again').onclick=()=>{eng.reset();$('hint').textContent='Trace le trait 1';}; if(!err) grade('k:'+k,2); },(i,n,err,msg)=>{ $('hint').textContent=msg?msg+' Trait '+(i+1)+' sur '+n+'.':`Trait ${i+1} sur ${n}`; }); };
  if($('quizt')) $('quizt').onclick=()=>{ mode='quiz'; $('quizt').classList.add('on'); $('trace').classList.remove('on'); kb.querySelectorAll('canvas').forEach(c=>c.remove());
    const n=(D.strokes[k]||[]).length, target=Math.floor(Math.random()*n); drawKanji(sw,k,{upto:0,ghost:true});

  x.vocab.forEach(v=>$('vl').appendChild(row(v)));
  if(related.length) related.slice(0,12).forEach(v=>{ const d=row(v); d.insertAdjacentHTML('beforeend',`<span class="unk">${v.seance}</span>`); $('rl').appendChild(d); }); }
function traceRun(list){ let i=0,total=list.length,errs=0; head('Tracer','dans l\'ordre des traits');
  const step=()=>{ if(i>=total){ $('view').innerHTML=`<div class="end"><div class="big jp">完</div><p>${total} kanji tracés · ${errs} erreur${errs>1?'s':''}</p><button class="btn" id="bk">Retour</button></div>`; $('bk').onclick=back; setBar(1); return; }

    $('view').innerHTML=`<div class="rv"><div class="kbox jp" id="kb" style="width:min(74vw,300px)"><div class="svgwrap" id="sw"></div></div><div class="kmeta"><div class="fr">${BYK[k].fr}</div><div class="n jps">${BYK[k].on.concat(BYK[k].kun).join('・')}</div></div><div class="hint" id="hint">Trace le trait 1 sur ${D.strokes[k].length}</div><div class="tools"><button class="tb" id="skip">Passer</button><button class="tb" id="show">Montrer</button></div></div>`;

function decouvrir(id){ const d=D.kanji[id]; const blocs=d.blocs||[{nom:d.titre.split('— ')[1]||'',from:d.range[0],to:d.range[1]}]; let bi=0,ki=0;
  head('Découvrir',d.titre.replace('Séance ','S').split(' — ')[0]);
  const kanjiOf=b=>d.kanji.filter(k=>k.n>=b.from&&k.n<=b.to); const steps=()=>`<div class="step">${blocs.map((b,i)=>`<i class="${i<bi?'done':i===bi?'on':''}"></i>`).join('')}</div>`;
  function intro(){ const b=blocs[bi], ks=kanjiOf(b); info(`bloc <b>${bi+1}</b> / ${blocs.length}`,''); setBar(bi/blocs.length);
    $('view').innerHTML=`<div class="scroll">${steps()}<div class="blob"><div class="lab">${d.titre.split('— ')[0]}</div><h2>${b.nom}</h2><p>${ks.length} kanji · n°${b.from} à ${b.to}</p><div class="ks jp">${ks.map(k=>k.k).join('')}</div><p>${ks.reduce((a,k)=>a+k.vocab.length,0)} mots, dont ${ks.reduce((a,k)=>a+k.vocab.filter(v=>v.star===true).length,0)} ★</p></div><button class="btn" id="go">Commencer</button><button class="btn o" id="skip">Passer ce bloc</button></div>`;

    const c=(D.comp||{})[k.k]||{}, cl=cleOf(k.k); const stars=k.vocab.filter(v=>v.star===true), others=k.vocab.filter(v=>v.star!==true);
    info(`${b.nom} · <b>${ki+1}</b> / ${ks.length}`,`n°${k.n} · ${k.strokes} traits`); setBar((bi+ki/ks.length)/blocs.length);
    $('view').innerHTML=`<div class="scroll"><div class="fiche"><div class="kbox jp" id="kb"><div class="svgwrap" id="sw"></div></div><div class="kmeta"><div class="fr">${k.fr}</div></div>
      <div class="readings">${k.on.length?`<div class="rd"><b>ON</b><span class="jps">${k.on.map(r=>(k.pale||[]).includes(r)?`<span class="pale">${r}</span>`:r).join('・')}</span></div>`:''}${k.kun.length?`<div class="rd"><b>kun</b><span class="jps">${k.kun.join('・')}</span></div>`:''}</div>
      ${cl?`<div class="comp"><span class="cp jp rad">${c.rad||cl.c}<small>${cl.nom||cl.r} · ${cl.fr.toLowerCase()}</small></span>${(c.parts||[]).filter(p=>p!==c.rad).map(p=>`<span class="cp jp">${p}</span>`).join('')}</div>`:''}

      <div class="nav" style="display:flex;gap:9px;padding:8px 18px 14px"><button class="btn o" id="pv" style="flex:0 0 68px;margin:0">‹</button><button class="btn" id="nx" style="margin:0">${ki+1<ks.length?'Suivant':'Vérifier ce bloc'}</button></div>`;
    drawKanji($('sw'),k.k,{animate:true});
    $('nx').onclick=()=>{ grade('k:'+k.k,1); ki++; ki<ks.length?kanjiStep():check(); }; $('pv').onclick=()=>{ if(ki>0){ki--;kanjiStep();} else intro(); }; }
  function check(){ const b=blocs[bi], ks=kanjiOf(b); const items=[]; ks.forEach(k=>{ items.push({id:'k:'+k.k,type:'kanji',k,flow:'exam'}); k.vocab.filter(v=>v.star===true).slice(0,2).forEach(v=>items.push({id:'v:'+v.w+'/'+v.r,type:'vocab',v:{...v,seance:id,kanji:k.k},flow:'exam'})); });
    go(session,{items:pick(items,6),label:'Contrôle · '+b.nom,onEnd:()=>{ nav.pop(); bi++; bi<blocs.length?intro():fin(); }}); }

    $('view').innerHTML=`<div class="end"><div class="big jp">了</div><p>${d.titre.split('— ')[1]} parcourue.<br>${d.kanji.length} kanji découverts · ${m} en cours d'acquisition</p><button class="btn" id="rev">Réviser cette séance</button><button class="btn o" id="bk">Terminer</button></div>`;

    if(it.type==='read') return t<2?['read']:t===2?['lecture2']:['clavier']; if(it.type==='cloze') return ['cloze']; return [it.type]; };
  const next=()=>{ if(lives<=0){ fin(); return; } const pool=items.filter(it=>it.type!=='sent'); const it=pool[Math.random()*pool.length|0]; const A=anglesTier(it); const angle=A[Math.random()*A.length|0];
    info(`<b>${n}</b> questions · palier ${tier()+1}`,`<span class="lives">${[0,1,2].map(i=>`<i class="${i<lives?'':'off'}"></i>`).join('')}</span>`); setBar(Math.min(1,n/40));
    renderItem(it,angle,(good,g)=>{ if(good) n++; else lives--; if(W) grade(it.id,g,W); later(next,good?450:950); },{mode:angle==='clavier'?'clavier':undefined}); };
  const fin=()=>{ const k='sv:'+id; const rec=n>(S.best[k]||0); if(rec){ S.best[k]=n; save(); } setBar(1); info('');
    $('view').innerHTML=`<div class="end"><div class="big">${n}</div><p>questions tenues avant la troisième erreur<br>${rec?'<b style="color:var(--seal)">Nouveau record.</b>':'Record : '+(S.best[k]||0)}</p><button class="btn" id="ag">Rejouer</button><button class="btn o" id="bk">Terminer</button></div>`;
    $('ag').onclick=()=>{ nav.pop(); go(survival,id); }; $('bk').onclick=home_; };
  next(); }
/* Exercices libres */
function libre(){ head('Exercices libres','rien n\'est enregistré');
  const T=[['reco','Japonais → français'],['rappel','Français → japonais'],['read','Quelle lecture'],['lecture2','Lecture → mot'],['gread','Lire les kanji (grammaire)'],['cloze','Kanji manquant'],['clavier','Écrire la lecture'],['stroke','Ordre des traits'],['count','Nombre de traits'],['kcle','Clé d\'un kanji'],['sent','Construire la phrase'],['sentfr','Traduire une phrase'],['elem','Éléments de phrase'],['epart','Particules'],['te','Forme en て'],['opp','Contraires']].concat(TTS.ok?[['listen','Écoute → sens'],['listenw','Écoute → écriture'],['dictee','Dictée']]:[]);
  let type='reco';
  const draw=()=>{ $('view').innerHTML=`<div class="scroll" style="padding-top:8px"><div class="sec" style="margin-top:0">Type d'exercice</div><div class="chips">${T.map(([k,l])=>`<button class="chip ${k===type?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><button class="btn" id="go" style="margin-top:18px">Choisir la portée</button></div>`;
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;draw();});
    $('go').onclick=()=>go(scopePick,{title:T.find(x=>x[0]===type)[1],then:sc=>{ const all=scopeItems(sc.ids);
      const map={reco:'vocab',rappel:'vocab',clavier:'vocab',listen:'vocab',listenw:'vocab',dictee:'vocab',gread:'vocab',read:'read',lecture2:'read',cloze:'cloze',stroke:'kanji',count:'kanji',kcle:'kanji',sent:'sent',sentfr:'sent',elem:'elem',epart:'elem',te:'te',opp:'opp'};
      let its=all.filter(it=>it.type===map[type]); if(type==='kcle') its=its.filter(it=>cleOf(it.k.k)&&!(D.comp[it.k.k]||{}).self); if(type==='clavier'||type==='dictee') its=its.filter(it=>it.v&&it.v.r);
      if(type==='gread') its=its.filter(it=>it.v.src==='gram'&&hasKan(it.v.w)&&it.v.r&&it.v.r!==it.v.w); if(type==='epart') its=its.filter(it=>hasPart(it.p));
      if(!its.length){toast('Rien pour ce type dans cette sélection');return;} go(session,{items:sh(its).slice(0,40).map(it=>({...it,angle:type})),label:T.find(x=>x[0]===type)[1],free:true}); }}); }; draw(); }

/* ═══════ EXAMEN BLANC ═══════ */
function examSetup(){ head('Examen blanc de kanji','épreuve chronométrée'); const se=D.manifest.cours.kanji.seances.filter(x=>unlocked(x.id)), gs=D.manifest.cours.grammaire.lecons.filter(x=>x.id!=='L00'&&unlocked(x.id)); let sel=new Set(se.map(x=>x.id)), selg=new Set(gs.map(x=>x.id)), nq=30, dur=15;
  const draw=()=>{ $('view').innerHTML=`<div class="scroll" style="padding-top:8px"><p class="hint" style="text-align:left;padding:0 2px 8px">Lectures, sens, kanji manquants, ordre des traits, clés, forme en て, contraires, thème. Correction par type à la fin.</p>
    <div class="sec">Séances de kanji</div><div class="chips" id="ch"></div><div class="sec">Leçons de grammaire</div><div class="chips" id="cg"></div>
    <div class="sec">Questions</div><div class="chips" id="nq">${[15,30,50,80].map(n=>`<button class="chip ${n===nq?'on':''}" data-v="${n}">${n}</button>`).join('')}</div>
    <div class="sec">Durée</div><div class="chips" id="du">${[10,15,25,40].map(n=>`<button class="chip ${n===dur?'on':''}" data-v="${n}">${n} min</button>`).join('')}</div>
    <button class="btn s" id="go" style="margin-top:18px">Lancer l'épreuve</button></div>`;
    se.forEach(x=>{ const b=document.createElement('button'); b.className='chip'+(sel.has(x.id)?' on':''); b.textContent=x.id; b.onclick=()=>{ sel.has(x.id)?sel.delete(x.id):sel.add(x.id); draw(); }; $('ch').appendChild(b); });
    gs.forEach(x=>{ const b=document.createElement('button'); b.className='chip'+(selg.has(x.id)?' on':''); b.textContent=x.id; b.onclick=()=>{ selg.has(x.id)?selg.delete(x.id):selg.add(x.id); draw(); }; $('cg').appendChild(b); });
    $('nq').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{nq=+b.dataset.v;draw();}); $('du').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{dur=+b.dataset.v;draw();});
    $('go').onclick=()=>{ if(!sel.size&&!selg.size){toast('Choisis au moins une séance ou une leçon');return;} go(exam,{ids:[...sel,...selg],nq,dur}); }; }; draw(); }
function buildExam(ids,nq){ const all=scopeItems(ids); const by=t=>sh(all.filter(i=>i.type===t)); const Q=[];
  const add=(list,angle,frac,lab)=>list.slice(0,Math.ceil(nq*frac)).forEach(it=>Q.push({it,angle,lab}));
  add(by('read'),'read',.22,'Lecture'); add(by('vocab'),'reco',.15,'Sens'); add(by('cloze'),'cloze',.15,'Kanji manquant'); add(by('kanji'),'stroke',.12,'Ordre des traits');
  add(by('kanji').filter(i=>cleOf(i.k.k)&&!(D.comp[i.k.k]||{}).self),'kcle',.08,'Clé'); add(by('kanji'),'count',.04,'Nombre de traits');
  add(by('te'),'te',.08,'Forme en て'); add(by('opp'),'opp',.06,'Contraires'); add(by('sent'),'sent',.1,'Thème');
  return sh(Q).slice(0,nq); }
function exam({ids,nq,dur,kind}){ const Q=kind==='td'?buildExamTD(nq):buildExam(ids,nq); if(!Q.length){ toast('Pas assez de contenu'); return back(); } let i=0,ans=[],t0=Date.now(),end=t0+dur*60000,lock=false; head(kind==='td'?'Contrôle de TD':'Examen de kanji','ne ferme pas l\'appli');
  cur.stop=()=>clearInterval(cur.tick);
  cur.tick=setInterval(()=>{ const left=Math.max(0,end-Date.now()); $('subR').innerHTML=`<span class="timer${left<60000?' warn':''}">${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}</span>`; if(left<=0){ clearInterval(cur.tick); results(); } },250);
  const show=()=>{ if(i>=Q.length){ clearInterval(cur.tick); results(); return; } const q=Q[i]; lock=false; info(`<b>${i+1}</b> / ${Q.length} · ${q.lab}`,''); setBar(i/Q.length);
    renderItem(q.it,q.angle,(good,g)=>{ if(lock)return; lock=true; ans.push({q,good}); grade(q.it.id,g); i++; later(show,220); }); };
  const results=()=>{ const sec=Math.round((Date.now()-t0)/1000), ok=ans.filter(a=>a.good).length, n=ans.length||1; const byType={}; ans.forEach(a=>{ const t=byType[a.q.lab]=byType[a.q.lab]||{ok:0,n:0}; t.n++; if(a.good) t.ok++; }); const wrong=ans.filter(a=>!a.good); const note=Math.round(ok/n*200)/10;
    info(''); setBar(1); $('view').innerHTML=`<div class="scroll"><div class="end" style="padding-bottom:10px"><div class="big">${note}<span style="font-size:24px;color:var(--ink2)">/20</span></div><p>${ok} / ${n} · ${Math.floor(sec/60)} min ${sec%60}s${ans.length<Q.length?'<br>temps écoulé avant la fin':''}</p></div>
      <div class="sec">Par type de question</div><div id="rt"></div>${wrong.length?`<div class="sec">À revoir (${wrong.length})</div><div id="rw"></div>`:'<p class="hint">Sans faute.</p>'}
      <button class="btn" id="again" style="margin-top:16px">Nouvelle épreuve</button>${wrong.length?'<button class="btn o" id="rev">Réviser mes erreurs</button>':''}<button class="btn o" id="bk">Terminer</button></div>`;
    Object.entries(byType).forEach(([lab,v])=>{ const p=v.ok/v.n; const d=document.createElement('div'); d.className='res'; d.innerHTML=`<span class="lb">${lab}</span><span class="bar"><i style="width:${p*100}%;background:${p>=.8?'var(--ok)':p>=.5?'var(--gold)':'var(--ko)'}"></i></span><span class="pc">${v.ok}/${v.n}</span>`; $('rt').appendChild(d); });
    if(wrong.length) wrong.slice(0,40).forEach(a=>{ const it=a.q.it; const d=document.createElement('div'); d.className='wk'; const lab=it.k?it.k.k:it.v?it.v.w:it.r?it.r.w:it.c?it.c.w:it.a?it.a.w:it.t?'章':it.p?'文':'文'; const ans_=it.k?it.k.fr:it.v?it.v.fr+(it.v.r?', '+it.v.r:''):it.r?it.r.r:it.c?it.c.k:it.a?it.a.opp.join(' / '):it.s?it.s.jp+'<br>'+it.s.fr:it.p?it.p.seg.map(x=>x[0]).join('')+'<br>'+it.p.fr:it.t?it.t.titre:'';
      d.innerHTML=`<span class="k jp">${lab}</span><span class="m">${a.q.lab}<small>${ans_}</small></span>`; $('rw').appendChild(d); });
    $('again').onclick=()=>{ nav.pop(); go(exam,{ids,nq,dur,kind}); }; if($('rev')) $('rev').onclick=()=>go(session,{items:sh(wrong.map(a=>a.q.it)),label:'Mes erreurs'}); $('bk').onclick=home_; };
  show(); }
/* ═══════ MES AJOUTS ═══════ */
function perso(){ head('Mes ajouts','enregistrés sur ce téléphone');
  $('view').innerHTML=`<div class="scroll" style="padding-top:8px"><div class="field"><label>Mot (kanji ou kana)</label><input id="pw" class="jp" placeholder="図書館"></div><div class="field"><label>Lecture</label><input id="pr" class="jps" placeholder="としょかん"></div><div class="field"><label>Sens</label><input id="pf" placeholder="la bibliothèque"></div><button class="btn" id="add">Ajouter</button><div class="sec">Liste</div><div class="vlist" id="pl"></div></div>`;
  const draw=()=>{ const pl=$('pl'); pl.innerHTML=S.perso.length?'':'<p class="hint" style="text-align:left">Rien pour l\'instant. Ce que tu ajoutes ici entre dans le flux Enrichir.</p>';
    S.perso.forEach((p,i)=>{ const d=document.createElement('div'); d.className='vi'; d.innerHTML=`<span class="w jp">${esc(p.w)}</span><span class="r jps">${esc(p.r)}</span><span class="f">${esc(p.fr)}</span>${spk(p.r||p.w)}<button class="tb">✕</button>`; d.querySelector('.tb').onclick=()=>{ S.perso.splice(i,1); save(); index(); draw(); }; pl.appendChild(d); }); };
  $('add').onclick=()=>{ const w=$('pw').value.trim(),r=$('pr').value.trim(),fr=$('pf').value.trim(); if(!w||!fr){toast('Mot et sens obligatoires');return;} S.perso.push({w,r,fr}); save(); index(); $('pw').value=$('pr').value=$('pf').value=''; draw(); toast('Ajouté'); }; draw(); }

/* ═══════ À PROPOS ═══════ */
function about(){ head('À propos','');
  $('view').innerHTML=`<div class="scroll about" style="padding-top:8px">
  <p>Cette appli est faite par <b>Moussa M.</b> pour réviser les cours de kanji et de grammaire de L1 LEA japonais, à Lyon 3.</p>
  <p>Je l'ai d'abord construite pour moi. Comme elle m'aide, je la partage à qui veut s'en servir — gratuitement, sans rien en attendre.</p>
  <h3>Ce que c'est</h3><p>Un outil de révision basé sur les documents de nos cours. Le vocabulaire, les lectures et les listes viennent des séances de M. Couteau (kanji) et de Mme Noda (grammaire). Les exercices du contrôle de TD suivent le format donné par Mme Rydzek ; les petits textes sont écrits pour l'appli.</p>
  <h3>Ce que ce n'est pas</h3><p>Une source officielle. En cas de doute, <b>le cours fait foi</b>, pas l'appli. Des fautes de saisie sont possibles : si tu en repères une, écris-moi et je corrige.</p>
  <h3>Mises à jour</h3><p>J'ajoute le contenu au fil des séances. Les séances et leçons non encore vues en cours sont grisées, mais tu peux les débloquer toi-même pour prendre de l'avance.</p>
  <h3>Audio</h3><p>La prononciation utilise la voix japonaise de ton téléphone. C'est une synthèse, pas un locuteur natif : correcte sur les mots, plus mécanique sur les phrases, et elle ne rend pas l'accent de hauteur. Sur Android, installe le pack vocal japonais si le bouton n'apparaît pas.</p>
  <h3>Me contacter</h3><p>Discord <a>Mouss_</a>, Instagram <a href="https://instagram.com/Froshhhh" target="_blank">@Froshhhh</a></p>
  <h3>Crédits</h3><p>Ordre des traits et composants : <a href="http://kanjivg.tagaini.net" target="_blank">KanjiVG</a>, par Ulrich Apel, licence CC BY-SA 3.0.<br>Contenu pédagogique : cours de L1 LEA japonais, Université Jean Moulin Lyon 3.</p></div>`; }

    ${T('ta','Audio','prononciation par la voix japonaise du téléphone'+(TTS.ok?'':'. Aucune voix japonaise détectée'),S.opt.audio)}${T('tas','Prononcer automatiquement','chaque mot est lu quand il apparaît',S.opt.autoSpeak)}

    <div class="sec">Nouveaux par jour</div><div class="tools" style="justify-content:flex-start;margin-top:8px">${[4,8,12,20].map(n=>`<button class="tb ${S.opt.newPerDay===n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
    <div class="sec">Données</div><button class="btn o" id="exp">Exporter ma progression</button><button class="btn o" id="imp">Importer</button><button class="btn o" id="rst" style="color:var(--ko)">Tout effacer</button>

  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ S.opt.newPerDay=+b.dataset.n; save(); document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x===b)); });
  $('exp').onclick=()=>{ const t=JSON.stringify({srs:S.srs,opt:S.opt,perso:S.perso,log:S.log,unlocked:S.unlocked,best:S.best}); (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(()=>toast('Copié'),()=>prompt('Copie :',t)):prompt('Copie :',t)); };
  $('imp').onclick=()=>{ const t=prompt('Colle ta sauvegarde :'); if(!t)return; try{ const d=JSON.parse(t); S.srs=d.srs||{};S.opt=Object.assign(S.opt,d.opt||{});S.perso=d.perso||[];S.log=d.log||{};S.unlocked=d.unlocked||{};S.best=d.best||{}; save(); index(); toast('Restauré'); }catch(e){ toast('Texte invalide'); } };
  $('rst').onclick=()=>{ if(confirm('Effacer toute la progression ?')){ S.srs={};S.perso=[];S.log={};S.unlocked={};S.best={}; save(); index(); toast('Effacé'); } }; }
